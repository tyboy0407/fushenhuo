<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>富紳活 尺寸簿</title>
<meta name="description" content="新家各房間的牆面尺寸，找到喜歡的家具時馬上比對放不放得下。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：左邊是立面圖（桌機固定在畫面上），右邊是編輯與比對面板；手機改成上下排列。 */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --paper:#FAFBF9; --ink:#1B2628; --muted:#5A696C; --line:#CBD3D1;
  --accent:#0B6B78; --accent-soft:#D8EBEE; --furn:#A85F06; --furn-soft:#F8E6C9;
  --ok:#256F45; --ok-soft:#DDF0E4; --bad:#B5362A; --bad-soft:#F8DFDB;
  --struct:#39464A; --cab:#E9EEEC; --warn-soft:#FBEFD2; --warn:#7A5200; --field:#7C898B;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111617; --surface:#1A2122; --paper:#151B1C; --ink:#E5EBEA; --muted:#93A2A4; --line:#313D40;
    --accent:#5FC6D3; --accent-soft:#16383E; --furn:#E8A548; --furn-soft:#3D2E14;
    --ok:#74C996; --ok-soft:#173424; --bad:#F2857A; --bad-soft:#40201C;
    --struct:#6B797C; --cab:#232C2E; --warn-soft:#3A2F12; --warn:#E9C46A; --field:#738285;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.02em}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.local::before{background:var(--furn)} .sync.error::before{background:var(--bad)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.chip.sub[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:16px;align-items:start;margin-top:12px}
.stage{position:sticky;top:10px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.toolbar .meta{display:none}
.toolbar .sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:34px;padding:0 10px;font-size:14px}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.zoomv{font:500 13px var(--mono);min-width:44px;text-align:center;color:var(--muted)}
.scroll{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;touch-action:pan-x pan-y}
#svg{display:block;width:100%;height:auto;margin:0 auto;user-select:none;-webkit-user-select:none}
#svg.fit{max-height:calc(100vh - 150px)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 2px 0}

.panel{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:15px;margin:0 0 8px;font-weight:700}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

.ed-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{flex:none;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--surface);font:600 12.5px var(--mono)}
.tag.furn{background:var(--furn)} .tag.dim{background:var(--muted)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--field);background:var(--paper);border-radius:7px;padding:7px 9px;min-height:38px}
.fld textarea{resize:vertical;min-height:58px}
.fld input:disabled,.fld select:disabled{color:var(--muted);background:var(--bg);border-color:var(--line)}
.fld input.invalid{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ferr{color:var(--bad);font-size:13px;margin:4px 0 0}
.req{color:var(--bad);margin-left:2px}
.fld input[type=number]{font:500 14.5px var(--mono)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.readout{font-size:13px;color:var(--muted);margin:8px 0 0;font-variant-numeric:tabular-nums}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:7px;padding:6px 10px;font-size:13.5px;margin-top:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:10px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.danger{color:var(--bad)} .btn.danger.arm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}

.list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.li{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.li:hover{background:var(--bg)}
.li[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.li .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.li .nm.blank{color:var(--muted);font-weight:400}
.li .mt{margin-left:auto;flex:none;font:500 12.5px var(--mono);color:var(--muted);text-align:right}

.verdict-big{border-radius:8px;padding:9px 12px;font-weight:700;margin:10px 0 6px}
.verdict-big.ok{background:var(--ok-soft);color:var(--ok)} .verdict-big.no{background:var(--bad-soft);color:var(--bad)}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.slot[data-hi="1"]{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.slot-head{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-weight:500}
.slot-size{font:500 13px var(--mono);color:var(--muted)}
.vd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;margin-top:5px}
.vd.ok{color:var(--ok)} .vd.no{color:var(--bad)}
.vd .btn{margin-left:auto}
.fcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;display:flex;gap:10px;align-items:flex-start}
.fbody{flex:1;min-width:0}
.thumb{flex:none;width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--bg)}
.thumb.big{width:96px;height:96px}
.lphoto-link{display:block}
.fcard .inf{font-size:13px;color:var(--muted)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line);align-self:center}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c)}
.sw.none{background:linear-gradient(135deg,var(--surface) 45%,var(--bad) 45% 55%,var(--surface) 55%)}
.swm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px 3px 4px;font-size:13px;min-height:30px}
.swm .dot{width:20px;height:20px}
.swm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.swbreak{flex-basis:100%;height:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.fld .swc{width:40px;height:32px;min-height:32px;padding:0;border:1px solid var(--field);border-radius:8px;background:none}
.fld input[type=file]{padding:6px;font-size:13.5px}
#paneFurn:not([hidden]){display:flex;flex-direction:column}
#furnForm{order:0} #saved{order:2}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.more .grid2{margin-top:8px}
#f-photoPrev{display:flex;align-items:center;gap:10px;margin-top:6px}
.small-note.err{color:var(--bad)}
.saved-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin:16px 0 2px}
.saved-head h2{font-size:15px;margin:0}
.libbtn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
/* 收藏庫畫面 */
.lib{margin-top:12px}
.lib-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.lib-head h2{font-size:18px;margin:0;font-weight:700;flex:1;min-width:200px;text-wrap:balance}
.lib-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 10px}
.lib-bar .cnt{font-size:13.5px;color:var(--muted)}
#libTools,#libForm{display:flex;flex-direction:column;gap:10px}
#libTools:not(:empty),#libForm:not(:empty){margin-top:10px}
.libtool h3,.libform h3{margin:0 0 8px;font-size:15px}
.libnote{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:7px 12px;font-size:13.5px;margin-top:10px}
.chip.add{border-style:dashed;color:var(--muted)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input{flex:1;min-width:140px;border:1px solid var(--field);background:var(--paper);border-radius:7px;padding:7px 9px;min-height:38px}
.speclist{display:flex;flex-direction:column;gap:6px}
.photoprev{display:flex;align-items:center;gap:10px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-size:14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.lphoto{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg);display:block}
.lphoto.ph{display:grid;place-items:center;color:var(--muted);font-size:13px}
.lbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.lcat{font-size:12.5px;color:var(--muted)}
.lbody h3{margin:0;font-size:16px;display:flex;gap:7px;align-items:center;overflow-wrap:anywhere}
.lprice{font:600 17px var(--mono)}
.lspec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:4px 0 0;font-size:13.5px}
.lspec dt{color:var(--muted)} .lspec dd{margin:0;overflow-wrap:anywhere}
.lnote{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lnote a,.cmp a{color:var(--accent)}
.lbody>.row{margin-top:auto;padding-top:8px}
.cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cmp{border-collapse:collapse;min-width:100%;font-size:14px}
.cmp th,.cmp td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp td{min-width:160px;max-width:260px;overflow-wrap:anywhere}
.cmp th{position:sticky;left:0;z-index:1;background:var(--surface);color:var(--muted);font-weight:500;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.cmp .hd td{font-weight:700}
.cmp .cname{display:inline-flex;gap:7px;align-items:center}
.cmp .num{font:500 14.5px var(--mono)} .cmp .min{color:var(--ok);font-weight:600}
.cmp .nil{color:var(--muted)}
.cmp .act .row{margin-top:0}
.tbtn.add{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.fcard .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fcard .t b{overflow-wrap:anywhere}
.fcard .sz{font:500 13px var(--mono);color:var(--muted)}
.pill{font-size:12.5px;border-radius:999px;padding:1px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--bad-soft);color:var(--bad)}
.fcard p{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.fcard a{color:var(--accent)}
.small-note{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* 按鈕狀態 */
@media (hover:hover){
  .btn:hover:not(:disabled),.chip:hover,.tbtn:hover,.swm:hover{border-color:var(--muted)}
  .btn.primary:hover:not(:disabled),.tbtn.add:hover{filter:brightness(1.12)}
  .tab:hover{color:var(--ink)}
  .seg button:hover:not([aria-pressed="true"]){background:var(--bg)}
  .sw:hover{transform:scale(1.08)}
}
.btn:active:not(:disabled),.chip:active,.tbtn:active,.swm:active,.sw:active,.seg button:active{transform:scale(.96)}
.li:active,.tab:active{background:var(--bg)}
button:disabled{opacity:.45;cursor:not-allowed}
.push{margin-left:auto}

/* 可收合的區塊：編輯面板、物件清單、空位清單 */
.edsec,.slots{border-top:1px solid var(--line);margin-top:10px}
.edsec summary,.slots summary,.lgroup summary{cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);padding:9px 0;user-select:none;-webkit-user-select:none}
.edsec[open] summary,.slots[open] summary,.lgroup[open] summary{color:var(--ink)}
.slots{margin-top:14px}
.lgroup summary{padding:8px}
.lrows{display:flex;flex-direction:column;gap:4px}
.list{gap:2px}
.ed-actions{border-top:1px solid var(--line);padding-top:10px}
.sheet-close{display:none;margin-left:auto}

/* 提示訊息 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px 8px 16px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);width:max-content;max-width:calc(100vw - 32px)}
.toast .btn{background:transparent;color:inherit;border-color:currentColor;flex:none}

/* 頁首：窄螢幕用短標籤 */
.top .sm{display:none}

/* 比較表：各件不一樣的列加底色 */
.cmp tr.diff td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}

/* 立面圖 */
.wall{fill:var(--struct)} .room{fill:var(--paper)} .floor{stroke:var(--ink);stroke-width:1.2}
.hatch-bg{fill:var(--paper)} .hatch-ln{stroke:var(--muted);stroke-width:.55}
.it .shape{stroke:var(--ink);stroke-width:.7;fill:var(--surface)}
.it.cat-structure .shape{fill:var(--struct);stroke:var(--struct)}
.it.cat-trim .shape,.it.cat-board .shape{fill:url(#hatch)}
.it.cat-cabinet .shape{fill:var(--cab)}
.it.cat-door .shape{fill:var(--paper)}
.it.cat-furniture .shape{fill:var(--furn-soft);stroke:var(--furn);stroke-width:1}
.it.has-c .shape{fill:var(--c);fill-opacity:.92;stroke:color-mix(in srgb,var(--c) 62%,var(--ink));stroke-width:.9}
.it.cat-furniture.has-c .shape{fill-opacity:.62;stroke-width:1.1}
.it.has-c .bdg{fill:var(--ink)}
.it.bad .shape,.it.cat-furniture.bad .shape{fill:var(--bad-soft);fill-opacity:1;stroke:var(--bad);stroke-width:1.2}
.it.sel .shape,.it.cat-furniture.sel .shape{stroke:var(--accent);stroke-width:1.8}
.it .deco{stroke:var(--muted);stroke-width:.5;fill:none}
.it .deco.dash{stroke-dasharray:5 3}
.it .bdg{fill:var(--ink);stroke:var(--paper);stroke-width:.8}
.it.cat-furniture .bdg{fill:var(--furn)}
.it.sel .bdg{fill:var(--accent)}
.it .bdt{fill:var(--paper);font:600 7.4px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.it .nmt{fill:var(--ink);font:500 7.5px var(--sans);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:2px;stroke-linejoin:round;pointer-events:none}
.it .ref{stroke:var(--muted);stroke-width:.7;stroke-dasharray:4 2.5}
.it.sel .ref{stroke:var(--accent);stroke-width:1.2}
.it .hit{stroke:transparent;stroke-width:11;fill:none}
.nml{fill:var(--ink);font:500 7.5px var(--sans);dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
.it .mk{fill:var(--paper);stroke:var(--bad);stroke-width:1}
.it.sel .mk{stroke:var(--accent);stroke-width:1.8}
.it .mkt{fill:var(--ink);font:600 6.6px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.it.sel.free{cursor:move;touch-action:none}
.it{cursor:pointer}
.dl{stroke:var(--muted);stroke-width:.5;fill:none}
.dt{stroke:var(--ink);stroke-width:.8}
.dn{fill:var(--ink);font:500 8.5px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:2.4px;stroke-linejoin:round;pointer-events:none}
.total .dn{font-weight:600}
.user .dl{stroke:var(--ink);stroke-width:.6}
.it.sel .dl,.it.sel .dt{stroke:var(--accent)} .it.sel .dn{fill:var(--accent)}
.cl .dl,.cl .dt{stroke:var(--accent)} .cl .dl{stroke-dasharray:2 1.5;stroke-width:.7} .cl .dn{fill:var(--accent);font-weight:600}
.slot-hi{fill:var(--ok);fill-opacity:.16;stroke:var(--ok);stroke-width:1;stroke-dasharray:5 3;pointer-events:none}
.it .bdt{font-size:calc(7.4px*var(--t,1))}
.it .mkt{font-size:calc(6.6px*var(--t,1))}
.nml{font-size:calc(8px*var(--t,1));stroke-width:calc(2.6px*var(--t,1))}
.dn{font-size:calc(8.5px*var(--t,1));stroke-width:calc(2.4px*var(--t,1))}
.bhit{fill:transparent}
.badmark{display:none;pointer-events:none}
.it.bad .badmark{display:inline}
.badmark.hatch{fill:url(#hatchBad)}
.hatch-bad{stroke:var(--bad);stroke-width:1.5}
.badc{fill:var(--bad);stroke:var(--paper);stroke-width:1}
.badt{fill:var(--paper);font:700 calc(8px*var(--t,1)) var(--sans);text-anchor:middle;dominant-baseline:central}

/* 鍵盤焦點落在立面圖的物件上 */
.it:focus{outline:none}
.it:focus-visible .shape,.it:focus-visible .mk{stroke:var(--accent);stroke-width:2.6}
.it:focus-visible .ref{stroke:var(--accent);stroke-width:2}
.it:focus-visible .bdg{fill:var(--accent);stroke:var(--ink);stroke-width:1.4}
.lib-head h2:focus{outline:none}

/* 全螢幕看圖 */
.zoomgrp{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.tbtn.icon{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn.icon svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.full{overflow:hidden}
body.full .stage{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
body.full .scroll{flex:1;min-height:0}
body.full #svg.fit{max-height:none}
body.full .hint,body.full #addDecor{display:none}
@media (min-width:881px){
  body.full #editor.sheet{position:fixed;right:16px;bottom:16px;z-index:30;width:380px;max-height:72vh;overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,.28)}
  body.full .sheet-close{display:inline-flex;align-items:center}
}

@media (max-width:880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{position:static}
  #svg.fit{max-height:none}
  .libgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .lbody{padding:8px 10px 10px}
  .lbody h3{font-size:15px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* 頁首精簡成一行 */
  .top{gap:8px}
  .top h1{font-size:17px;letter-spacing:0}
  .top .lg{display:none} .top .sm{display:inline}
  .top .chip{padding:5px 11px} .top .btn{padding:7px 10px}
  .sync{padding:4px 8px;font-size:12.5px}
  .zoomv,.toolbar .sp{display:none}
  /* 編輯面板改成從底部滑出，立面圖留在上方 */
  #editor{display:none}
  #editor.sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:52vh;max-height:52dvh;overflow-y:auto;overscroll-behavior:contain;
    border-radius:14px 14px 0 0;border-width:1px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.28);padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
  #editor.sheet .ed-head{position:sticky;top:0;z-index:1;background:var(--surface);padding:10px 0 8px;margin-bottom:2px}
  .sheet-close{display:inline-flex;align-items:center}
  body.sheet-open .wrap{padding-bottom:56vh}
  body.sheet-open .toast{bottom:calc(52vh + 12px);bottom:calc(52dvh + 12px)}
  #scroll{scroll-margin-top:8px}
  body.full.sheet-open .stage{bottom:52vh;bottom:52dvh}
  /* 工具列放不下文字時只留圖示（文字仍留給報讀軟體） */
  body:not(.full) .tbtn.icon .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* 比較表：欄位縮窄，一次多看幾件 */
  .cmp{font-size:13.5px}
  .cmp th,.cmp td{padding:7px 9px}
  .cmp td{min-width:128px;max-width:200px}
  .cmp th{white-space:normal;min-width:60px;max-width:78px}
  .cmp .thumb.big{width:72px;height:72px}
}
/* 觸控：可點的地方至少 44px；輸入框 16px 以免 iPhone 自動放大畫面 */
@media (max-width:880px),(pointer:coarse){
  .chip{min-height:44px}
  .tbtn{height:44px;min-width:44px}

  .sw{width:40px;height:40px}

  .fld .swc{width:48px;height:44px;min-height:44px}

}

<div class="wrap">
  <header class="top">
    <h1>富紳活 尺寸簿</h1>
    <nav id="rooms" class="chips" aria-label="房間"></nav>

  </header>
  <div id="notice" class="notice" hidden></div>

  <main class="layout" id="screenMain">
    <section class="stage" aria-label="立面圖">
      <div class="toolbar">
        <div id="views" class="chips" aria-label="視角"></div>

        <button id="btnDims" class="tbtn" type="button" aria-pressed="true">尺寸標註</button>

        <span id="zoomVal" class="zoomv">100%</span>
        <button id="zoomIn" class="tbtn" type="button" aria-label="放大">＋</button>
        <button id="btnFull" class="tbtn icon" type="button" title="全螢幕看圖"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="lbl">全螢幕</span></button></span>
      </div>
      <div class="scroll" id="scroll">
        <svg id="svg" class="fit" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="牆面立面圖，可以用 Tab 鍵逐一選取圖上的物件">
          <defs>
            <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect class="hatch-bg" width="4" height="4"/><line class="hatch-ln" x1="0" y1="0" x2="0" y2="4"/>
            </pattern>
            <pattern id="hatchBad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line class="hatch-bad" x1="0" y1="0" x2="0" y2="6"/>
            </pattern>
          </defs>
          <g id="gBase" aria-hidden="true"></g><g id="gItems"></g><g id="gNames" aria-hidden="true"></g><g id="gDims" aria-hidden="true"></g><g id="gOver" aria-hidden="true"></g>
        </svg>
      </div>

    <aside class="panel">
      <section class="card" id="editor" aria-label="選取的物件"></section>

      </div>
      <div id="paneItems" role="tabpanel" aria-labelledby="tabItems">
        <div class="row" style="margin-top:0">

          <button class="btn" type="button" id="addDim">＋ 量測線</button>
          <button class="btn" type="button" id="addLine">＋ 參考線</button>
          <button class="btn" type="button" id="addMark">＋ 標記</button>
        </div>
        <div class="list" id="list"></div>
      </div>
      <div id="paneFurn" role="tabpanel" aria-labelledby="tabFurn" hidden>
        <form class="card" id="furnForm" autocomplete="off">
          <h2 id="furnTitle">放一件家具擺飾到圖上</h2>
          <label class="fld"><span>名稱</span><input id="f-name" type="text" maxlength="60" placeholder="例如：落地燈、三層櫃"></label>
          <div class="grid4" style="grid-template-columns:repeat(3,minmax(0,1fr))">
            <label class="fld"><span>寬（沿著牆）<span class="req" aria-hidden="true">＊</span></span><input id="f-w" type="number" inputmode="decimal" min="0" step="0.5" aria-required="true" aria-describedby="f-err"></label>
            <label class="fld"><span>深（往外凸）<span class="req" aria-hidden="true">＊</span></span><input id="f-d" type="number" inputmode="decimal" min="0" step="0.5" aria-required="true" aria-describedby="f-err"></label>
            <label class="fld"><span>高<span class="req" aria-hidden="true">＊</span></span><input id="f-h" type="number" inputmode="decimal" min="0" step="0.5" aria-required="true" aria-describedby="f-err"></label>
          </div>
          <p class="ferr" id="f-err" role="alert" hidden></p>
          <div class="fld" style="margin-top:8px"><span>顏色</span><div id="f-colors"></div></div>
          <div class="row">
            <button class="btn primary" type="button" id="furnPlace">放到圖上</button>
            <button class="btn" type="button" id="furnSave">存進收藏庫</button>
            <button class="btn" type="button" id="furnClear">清空</button>
          </div>
          <p class="small-note" id="furnMsg" role="status"></p>
          <p class="small-note">圖上比對的是寬和高；深度會記錄下來，放到圖上後可以把寬、深互換（轉 90°）。價格、類別、圖片請到完整收藏庫填寫。</p>
        </form>
        <div id="results"></div>
        <div id="saved"></div>
      </div>
    </aside>
  </main>

  <section class="lib" id="screenLib" aria-label="待購買評估家具擺飾收藏庫" hidden>
    <div class="lib-head">

    <div id="libForm"></div>

      </div>
      <span class="cnt" id="libCount"></span>
    </div>
    <div id="libBody"></div>
  </section>

  </div>
</div>

const clone = o => JSON.parse(JSON.stringify(o));

const n = v => { const x=Number(v); return Number.isFinite(x)?x:0; };

function getAt(root, path){ let o=root; for (const k of path.split('/').filter(Boolean)){ if (o==null) return undefined; o=o[k]; } return o; }

/* ---------- 儲存層：有設定 Supabase 就存雲端，否則存在這台裝置 ----------
   雲端資料表 fushenhuo_docs 一列存一個房間、一個視角、一個物件或一件家具，
   path 是它在資料裡的位置（例如 rooms/study/views/door/items/c）。 */
function applyDoc(root, path, doc){
  const segs=String(path||'').split('/').filter(Boolean); if (!segs.length) return;
  if (doc!==null && typeof doc!=='object') doc=null;
  const meta = segs[0]==='rooms' && (segs.length===2 || segs.length===4);
  if (!meta || doc===null){ setAt(root, segs, doc); return; }
  let o=root;
  for (const k of segs){ if (typeof o[k]!=='object' || o[k]===null) o[k]={}; o=o[k]; }
  const keep = segs.length===2 ? 'views' : 'items';
  for (const k of Object.keys(o)) if (k!==keep) delete o[k];
  for (const [k,v] of Object.entries(doc)) if (k!==keep) o[k]=v;
}
function flattenDoc(path, value){
  const p=path.split('/'), out=[];
  if (value==null) return [[path,null]];
  if (p[0]==='rooms' && p.length===2){
    const meta=Object.assign({},value); delete meta.views; out.push([path,meta]);
    for (const [vid,v] of Object.entries(value.views||{})) out.push(...flattenDoc(path+'/views/'+vid, v));
  } else if (p[0]==='rooms' && p.length===4){
    const meta=Object.assign({},value); delete meta.items; out.push([path,meta]);
    for (const [id,it] of Object.entries(value.items||{})) out.push([path+'/items/'+id, it]);
  } else out.push([path,value]);
  return out;
}
const store = (function(){
  const cfg=window.SITE_CONFIG||{};
  const url=String(cfg.supabaseUrl||'').trim().replace(/\/+$/,''), key=String(cfg.supabaseKey||'').trim();
  const remote=!!(url && key);
  const LS='fushenhuo-data-v1', TABLE='fushenhuo_docs', BUCKET='fushenhuo-photos';
  const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js';
  let sb=null;
  function client(){
    if (sb) return Promise.resolve(sb);
    return new Promise((res,rej)=>{
      if (window.supabase) return res();
      const el=document.createElement('script'); el.src=LIB; el.onload=()=>res(); el.onerror=()=>{ el.remove(); rej(new Error('library')); };
      document.head.append(el);
    }).then(()=>{ sb=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}); return sb; });
  }
  return {
    remote,
    async load(){
      if (!remote){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } }
      const c=await client();
      const {data,error}=await c.from(TABLE).select('path,data');
      if (error) throw error;
      const root={};
      for (const row of data||[]) applyDoc(root, row.path, row.data);
      return root;
    },
    async set(path, value){
      if (!remote){ try { localStorage.setItem(LS, JSON.stringify(S.data)); } catch(e){} return; }
      const c=await client(), docs=flattenDoc(path,value), now=new Date().toISOString();
      const up=docs.filter(d=>d[1]!=null).map(d=>({path:d[0],data:d[1],updated_at:now})), del=docs.filter(d=>d[1]==null).map(d=>d[0]);
      if (up.length){ const {error}=await c.from(TABLE).upsert(up); if (error) throw error; }
      if (del.length){ const {error}=await c.from(TABLE).delete().in('path',del); if (error) throw error; }
    },
    photoUrl(p){ return remote && /^[\w.-]+$/.test(p||'') ? url+'/storage/v1/object/public/'+BUCKET+'/'+p : ''; },
    // okIfExists：同名檔案已經在了也算成功（兩台裝置同時替同一張舊照片補縮圖時）
    async uploadPhoto(blob, name, okIfExists){
      const c=await client();
      const {data,error}=await c.storage.from(BUCKET).upload(name, blob, {contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
      if (error && !(okIfExists && (String(error.statusCode)==='409' || /exist/i.test(error.message||'')))) throw error;
      return (data && data.path) || name;
    },
    async removePhoto(...ps){
      const list=ps.filter(Boolean); if (!list.length) return;
      try { const c=await client(); await c.storage.from(BUCKET).remove(list); } catch(e){}
    },
    listen(onDoc, onReload, onState){
      if (!remote || !sb) return;
      let wasDown=false;
      sb.channel('fushenhuo-docs')
        .on('postgres_changes',{event:'*',schema:'public',table:TABLE}, p=>{
          if (p.eventType==='DELETE'){ if (p.old && p.old.path) onDoc(p.old.path,null); }
          else if (p.new && p.new.path) onDoc(p.new.path,p.new.data);
        })
        .subscribe(status=>{
          if (status==='SUBSCRIBED'){ onState(true); if (wasDown){ wasDown=false; onReload(); } }
          else { wasDown=true; onState(false); }
        });
      // 手機從背景回來時連線可能斷過，重新抓一次最新資料
      document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) onReload(); });
    }
  };
})();

let syncErr=false, inflight=0, online=true, loading=store.remote;
const pending = new Map();
function setSync(){
  const el=$('#sync'); let cls='ok', txt='已同步，所有人可見', short='已同步';
  if (!store.remote){ cls='local'; txt='只存在這台裝置'; short='僅本機'; }
  else if (loading){ cls=''; txt='連線中…'; short='連線中'; }
  else if (syncErr || !online){ cls='error'; txt='連線中斷，重新連線中…'; short='離線'; }
  else if (pending.size || inflight){ cls=''; txt='儲存中…'; short='儲存中'; }

}
// busy：正在送出的路徑；tomb：剛刪除的路徑和它的到期時間。
// 雲端的更新訊息可能比本機的操作晚到，這兩個用來擋掉「過期的訊息把剛做的修改或刪除蓋回去」。
const busy=new Set(), tomb=new Map();
function save(path){
  if (getAt(S.data, path)===undefined) tomb.set(path, Date.now()+10000); else tomb.delete(path);
  clearTimeout(pending.get(path));
  pending.set(path, setTimeout(()=>{ pending.delete(path); flush(path); }, 350));
  setSync();
}
async function flush(path){
  inflight++; busy.add(path);

}
function mergeSeed(data){

    const dr=data.rooms[rid]; if (!dr.views) dr.views={};
    for (const [vid,v] of Object.entries(room.views))

function problems(id, it){

  if (g.x<0 || g.y<0 || g.x+g.w>v.width || g.y+g.h>v.height) out.push('超出這面牆的範圍');

    if (q.y<g.y+g.h && q.y+q.h>g.y){ if (q.x+q.w<=g.x) L=Math.max(L,q.x+q.w); if (q.x>=g.x+g.w) R=Math.min(R,q.x); }
    if (q.x<g.x+g.w && q.x+q.w>g.x){ if (q.y+q.h<=g.y) D=Math.max(D,q.y+q.h); if (q.y>=g.y+g.h) U=Math.min(U,q.y); }

// LAY.T：窄螢幕時把圖上的字、代號圓點和牆外的標註區一起放大，手機上才看得清楚（桌機是 1）
const LAY={totalX:-50,below:30,T:1,W:270,H:270,totals:true};
const ox = x => x<0 ? x*LAY.T : (x>LAY.W ? LAY.W+(x-LAY.W)*LAY.T : x);   // 牆外的水平位置跟著放大

function drawDim(g,x1,y1,x2,y2,label,cls){
  const T=LAY.T, k=1.8*T, off=2.8*T, grp=s('g',{class:cls||''}), vert=x1===x2;
  grp.append(s('line',{x1,y1,x2,y2,class:'dl'}));

// 估計名稱的寬度（圖上的單位是公分）

function nameLabel(id, name, x, y, below, W){

function chain(edges){ const a=[...new Set(edges.map(r1))].sort((p,q)=>p-q); return a.slice(1).map((b,i)=>[a[i],b]); }
function renderDims(){

  if (cr.length>1) for (const [a,b] of cr) drawDim(gDims,xr,H-a,xr,H-b,fmt(b-a));

const ZOOMS=[1,1.5,2,3,4], ZMAX=4;
function applyZoom(){
  const sc=$('#scroll'), z=S.zoom;
  svgEl.classList.toggle('fit',z===1);
  if (S.full){
    // 全螢幕：圖框佔滿畫面，圖在框內等比例放到最大
    sc.style.height=''; svgEl.style.width=(z*100)+'%'; svgEl.style.height=(z*100)+'%';
  } else if (z>1){
    // 放大後圖框維持原本的大小，在框裡上下左右移動
    const vb=svgEl.viewBox.baseVal; let hh=stageBox().w*vb.height/vb.width;
    if (!isNarrow()) hh=Math.min(hh, window.innerHeight-150);
    sc.style.height=Math.round(hh)+'px';
    svgEl.style.width=Math.round(z*hh*vb.width/vb.height)+'px'; svgEl.style.height='';
  } else { sc.style.height=''; svgEl.style.width='100%'; svgEl.style.height=''; }

// cx、cy：畫面上要固定不動的那一點（雙指的中點、滑鼠的位置）；沒給就用圖框中央
function setZoom(z, cx, cy){
  z=Math.min(ZMAX,Math.max(1,z)); if (Math.abs(z-1)<0.04) z=1;
  if (z===S.zoom) return;
  const sc=$('#scroll'), r=sc.getBoundingClientRect();
  const px=cx==null ? r.width/2 : cx-r.left, py=cy==null ? r.height/2 : cy-r.top;
  const fx=(sc.scrollLeft+px)/sc.scrollWidth, fy=(sc.scrollTop+py)/sc.scrollHeight;
  S.zoom=z; applyZoom();
  sc.scrollLeft=fx*sc.scrollWidth-px; sc.scrollTop=fy*sc.scrollHeight-py;
}
function zoomBy(d){
  const z=S.zoom, next=d>0 ? ZOOMS.find(q=>q>z+0.01) : ZOOMS.slice().reverse().find(q=>q<z-0.01);
  if (next) setZoom(next);

let toastTimer=null, toastEnd=null;
function toast(msg, undo, onExpire){
  if (toastEnd){ const f=toastEnd; toastEnd=null; f(false); }      // 前一則還沒結束就先收掉
  const el=$('#toast'), btn=$('#toastUndo');
  $('#toastMsg').textContent=msg; btn.hidden=!undo; el.hidden=false;
  toastEnd=undone=>{ clearTimeout(toastTimer); el.hidden=true; if (!undone && onExpire) onExpire(); };
  btn.onclick=()=>{ const f=toastEnd; toastEnd=null; if (f) f(true); if (undo) undo(); };
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ const f=toastEnd; toastEnd=null; if (f) f(false); }, 6000);
}

  for (const [,o] of solids(v,id)){ const q=geo(o); xs.push(q.x+q.w,q.x-g.w,q.x,q.x+q.w-g.w); ys.push(q.y+q.h,q.y-g.h,q.y,q.y+q.h-g.h); }
  const near=(val,arr)=>{ let best=val,d=T; for (const c of arr){ const dd=Math.abs(c-val); if (dd<d){ d=dd; best=c; } } return best; };
  return [near(x,xs), near(y,ys)];
}

/* ---------- 擺設：比對空位、放到圖上、收藏庫 ---------- */
function computeSlots(v, exclude){
  const W=v.width, H=v.height;
  const obs=solids(v,exclude).map(([,it])=>{ const g=geo(it);
    return {it,x1:Math.max(0,g.x),x2:Math.min(W,g.x+g.w),y1:Math.max(0,g.y),y2:Math.min(H,g.y+g.h)}; }).filter(o=>o.x2>o.x1 && o.y2>o.y1);
  const xs=[...new Set([0,W,...obs.flatMap(o=>[o.x1,o.x2])])].sort((a,b)=>a-b);
  const sups=[{y:0,x1:0,x2:W,it:null}];
  for (const o of obs) if (SUPPORT_CATS.includes(o.it.cat) && o.y2<H) sups.push({y:o.y2,x1:o.x1,x2:o.x2,it:o.it});
  const out=[];
  for (const sp of sups){
    const xr=xs.filter(x=>x>=sp.x1 && x<=sp.x2), cand=[];
    for (let i=0;i<xr.length;i++) for (let j=i+1;j<xr.length;j++){
      const a=xr[i], b=xr[j]; let top=H, cap=null, blocked=false;
      for (const o of obs){
        if (o.x2<=a || o.x1>=b || o.y2<=sp.y) continue;
        if (o.y1<=sp.y){ blocked=true; break; }
        if (o.y1<top){ top=o.y1; cap=o.it; }
      }
      if (blocked || top-sp.y<8 || b-a<8) continue;
      cand.push({x1:a,x2:b,y1:sp.y,y2:top,sup:sp.it,cap});
    }
    for (const c of cand)
      if (!cand.some(d=>d!==c && d.x1<=c.x1 && d.x2>=c.x2 && d.y2>=c.y2 && (d.x1<c.x1 || d.x2>c.x2 || d.y2>c.y2))) out.push(c);
  }
  return out.sort((p,q)=>p.y1-q.y1 || p.x1-q.x1);
}
function fits(q, w, hh){ const dw=r1(q.x2-q.x1-w), dh=r1(q.y2-q.y1-hh); return {ok:dw>=0 && dh>=0, dw, dh}; }
function orientations(f){
  const o=[{key:'w',label:'正面靠牆（佔寬 '+fmt(f.w)+'）',w:f.w}];
  if (f.d>0 && f.d!==f.w) o.push({key:'d',label:'側面靠牆（佔寬 '+fmt(f.d)+'）',w:f.d});
  return o;
}

function shrinkImage(file, max, q){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,(max||1280)/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q||0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('image')); };
    img.src=u;
  });
}

function libItems(){
  const all=furnAll();

let afterScreen=null, prevScreen=null;
function applyScreen(){
  const lib=location.hash==='#library';
  if (lib && S.full) setFull(false);
  S.screen=lib?'lib':'main';
  const changed=prevScreen!==null && prevScreen!==S.screen; prevScreen=S.screen;
  $('#screenMain').hidden=lib; $('#screenLib').hidden=!lib; $('#rooms').hidden=lib; $('#openLib').hidden=lib;
  if (lib){ S.sel=null; document.body.classList.remove('sheet-open'); renderLib(); } else renderAll();
  const fn=afterScreen; afterScreen=null;
  if (fn) fn();
  else {
    window.scrollTo(0,0);
    // 換畫面後把鍵盤焦點帶過去：收藏庫的標題，或回到立面圖時的收藏庫按鈕
    if (changed) (lib ? $('#libTitle') : $('#openLib')).focus({preventScroll:true});
  }
}
function go(screen, then){
  const want=screen==='lib'?'#library':'';
  afterScreen=then||null;
  if ((location.hash||'')===want || (!want && location.hash==='#')) applyScreen(); else location.hash=want;
}
window.addEventListener('hashchange', applyScreen);

async function saveLibForm(btn){
  const F=L.form; if (!F) return;
  const say=(t,err)=>{ F.msg=t; F.err=!!err; const el=$('#lf-msg'); if (el){ el.textContent=t; el.classList.toggle('err',!!err); } };
  const name=F.name.trim();
  if (!name){
    const e=$('#lf-nameErr'), i=$('#lf-name');
    e.hidden=false; e.textContent='請填寫名稱，才能加入收藏庫。'; i.classList.add('invalid'); i.setAttribute('aria-invalid','true'); i.focus();
    return;
  }
  btn.disabled=true;
  const id=F.id||uid('f'); if (!S.data.furniture) S.data.furniture={};
  const old=S.data.furniture[id];
  let photo=F.photo||'', thumb='', photoErr=false;
  if (F.file){
    say('圖片上傳中…');
    const base=id+'-'+Date.now().toString(36);
    try {
      photo=await store.uploadPhoto(await shrinkImage(F.file), base+'.jpg');
      try { thumb=await store.uploadPhoto(await shrinkImage(F.file,THUMB,0.8), base+'-s.jpg'); } catch(e){}   // 縮圖沒傳成功就用原圖
    } catch(e){ photoErr=true; photo=old ? old.photo||'' : ''; }
  }
  // 照片沒換：沿用現有的縮圖（以最新的資料為準，背景可能剛補做好）
  if (photo && old && old.photo===photo) thumb=old.thumb||'';
  if (old && old.photo && old.photo!==photo) store.removePhoto(old.photo, old.thumb);
  const dim=v=>{ const x=parseFloat(v); return x>0?r1(x):''; }, price=parseFloat(F.price);
  let url=F.url.trim(); if (url && !/^https?:\/\//i.test(url)) url='https://'+url; if (/\s/.test(url)) url='';
  const specs={}; for (const [k,v] of Object.entries(F.specs||{})){ const t=String(v||'').trim(); if (t) specs[k]=t; }
  const rec={name,cat:catOf(F.cat)?F.cat:'',price:price>=0?price:'',shop:F.shop.trim(),url,w:dim(F.w),d:dim(F.d),h:dim(F.h),
             color:okColor(F.color),note:F.note.trim(),photo,thumb,specs,ts:old?old.ts:Date.now()};
  S.data.furniture[id]=rec; save('furniture/'+id); syncPlaced(id,old,rec);
  if (F.fileUrl) URL.revokeObjectURL(F.fileUrl);
  L.form=null;
  if (L.cat!=='all' && L.cat!==(rec.cat||'none')) L.cat=rec.cat||'none';
  L.note=photoErr ? '「'+name+'」已儲存，但圖片沒有上傳成功。' : '「'+name+'」已'+(old?'更新':'加入收藏庫')+'。';
  renderLib();
}

function deleteLibItem(id){
  const f=S.data.furniture && S.data.furniture[id]; if (!f) return;
  const copy=clone(f);

  if (L.form && L.form.id===id) closeLibForm();

function libTable(list, c){
  const rows=list.slice().sort((a,b)=>(hasPrice(a[1])?Number(a[1].price):Infinity)-(hasPrice(b[1])?Number(b[1].price):Infinity) || n(a[1].ts)-n(b[1].ts));
  const priced=rows.filter(e=>hasPrice(e[1])), low=priced.length>1 ? Math.min(...priced.map(e=>Number(e[1].price))) : null;
  // cmp 為 true 的列：各件的值不一樣時整列加底色，一眼看出差在哪
  const tr=(label,cell,cls,cmp)=>{
    const vals=[], tds=rows.map(([id,f])=>{
      const td=h('td'), x=cell(id,f);
      if (x instanceof Node){ td.append(x); vals.push(x.textContent); }
      else if (x===''||x==null){ td.textContent='—'; td.className='nil'; vals.push(''); }
      else { td.textContent=String(x); vals.push(String(x)); }
      return td; });
    const diff=!!cmp && rows.length>1 && new Set(vals).size>1;
    return h('tr',{class:[cls,diff?'diff':''].filter(Boolean).join(' ')||null}, h('th',{scope:'row',text:label}), ...tds);
  };
  const num=v=>n(v)>0?fmt(n(v)):'';
  const body=[
    tr('圖片',(id,f)=>photoImg(f,'thumb big')||''),
    tr('名稱',(id,f)=>h('span',{class:'cname'}, okColor(f.color)?h('span',{class:'dot',style:'--c:'+okColor(f.color)}):null, f.name||'未命名'),'hd'),
    tr('價格',(id,f)=>hasPrice(f)?h('span',{class:'num'+(low!==null && Number(f.price)===low?' min':''),text:priceText(f)+(low!==null && Number(f.price)===low?'（最低）':'')}):'',null,true),
    tr('店家／品牌',(id,f)=>f.shop,null,true),
    tr('寬',(id,f)=>num(f.w),null,true), tr('深',(id,f)=>num(f.d),null,true), tr('高',(id,f)=>num(f.h),null,true)
  ];
  if (c) for (const sp of specsOf(c)) body.push(tr(sp.name||'規格',(id,f)=>f.specs && f.specs[sp.id],null,true));
  else body.push(tr('類別',(id,f)=>{ const k=catOf(f.cat); return k?(k.name||'未命名類別'):'未分類'; },null,true));
  body.push(tr('備註',(id,f)=>f.note), tr('連結',(id,f)=>libLink(f)||''), tr('',(id,f)=>libActions(id,f),'act'));
  return h('div',{class:'cmpwrap'}, h('table',{class:'cmp'}, h('tbody',{}, ...body)));
}

  }
  if (L.mode==='table'){
    const kids=[];
    if (!c) kids.push(h('p',{class:'small-note',style:'margin:0 0 8px',text:'選一個類別再看比較表，會多出那個類別自訂的規格項目。'}));
    if (list.length>1) kids.push(h('p',{class:'small-note',style:'margin:0 0 8px',text:'有底色的列，表示這幾件在那一項不一樣。'}));
    kids.push(libTable(list,c)); box.replaceChildren(...kids);
  } else box.replaceChildren(h('div',{class:'libgrid'}, ...list.slice().sort((a,b)=>n(b[1].ts)-n(a[1].ts)).map(([id,f])=>libCard(id,f))));
}
// 別人改了資料時更新畫面；正在輸入的區塊不重畫
function renderLibRemote(){
  renderLibCats(); renderLibBody();
  if (!$('#libTools').contains(document.activeElement)) renderLibTools();
}
$('#openLib').addEventListener('click', ()=>go('lib'));
$('#libBack').addEventListener('click', ()=>go('main'));
$('#libAdd').addEventListener('click', ()=>openLibForm(null));
$('#libModeCards').addEventListener('click', ()=>{ L.mode='cards'; renderLibBody(); });
$('#libModeTable').addEventListener('click', ()=>{ L.mode='table'; renderLibBody(); });

/* ---------- 工具列、分頁 ---------- */
function setTab(t){
  S.tab=t;
  for (const [id,on] of [['#tabItems',t==='items'],['#tabFurn',t==='furn']]){ $(id).setAttribute('aria-selected',String(on)); $(id).tabIndex=on?0:-1; }
  $('#paneItems').hidden=t!=='items'; $('#paneFurn').hidden=t!=='furn';
  if (t==='furn'){ renderResults(); renderSaved(); } else renderList();
  renderOver();
}
$('#tabItems').addEventListener('click', ()=>setTab('items'));
$('#tabFurn').addEventListener('click', ()=>setTab('furn'));
// 分頁：左右鍵、Home、End 切換
$('#tabs').addEventListener('keydown', e=>{
  if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  const t=e.key==='Home' ? 'items' : e.key==='End' ? 'furn' : (S.tab==='items' ? 'furn' : 'items');
  setTab(t); $(t==='items'?'#tabItems':'#tabFurn').focus();
});
$('#addBox').addEventListener('click', ()=>addItem('box'));
$('#addDim').addEventListener('click', ()=>addItem('dim'));
$('#addLine').addEventListener('click', ()=>addItem('line'));
$('#addMark').addEventListener('click', ()=>addItem('mark'));
$('#btnDims').addEventListener('click', e=>{ S.showDims=!S.showDims; e.currentTarget.setAttribute('aria-pressed',String(S.showDims)); renderDims(); });
$('#zoomIn').addEventListener('click', ()=>zoomBy(1));
$('#zoomOut').addEventListener('click', ()=>zoomBy(-1));
$('#btnFull').addEventListener('click', ()=>{ if (S.full) exitFull(); else enterFull(); });
// 雙指開合縮放（手指的中點固定不動）；第二根手指放上來時取消拖曳
(function(){
  const sc=$('#scroll'); let pinch=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  sc.addEventListener('touchstart', e=>{
    if (e.touches.length!==2){ pinch=null; return; }
    pinch={d:dist(e.touches)||1, z:S.zoom};
    if (drag){
      const d=drag, it=d.on && d.moved && items()[d.id]; drag=null;
      if (it){ it.x=d.ox; it.y=d.oy; renderStage(); renderReadout(); }
    }
  }, {passive:true});
  sc.addEventListener('touchmove', e=>{
    if (!pinch || e.touches.length!==2) return;
    if (e.cancelable) e.preventDefault();
    const t=e.touches;
    setZoom(pinch.z*dist(t)/pinch.d, (t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2);
  }, {passive:false});
  const end=e=>{ if (e.touches.length<2) pinch=null; };
  sc.addEventListener('touchend', end); sc.addEventListener('touchcancel', end);
  sc.addEventListener('gesturestart', e=>e.preventDefault());          // iOS Safari：不要連整個網頁一起放大
  // 桌機：觸控板雙指開合、或按住 Ctrl 滾滑鼠滾輪
  sc.addEventListener('wheel', e=>{
    if (!e.ctrlKey) return;
    e.preventDefault(); setZoom(S.zoom*Math.exp(-e.deltaY*0.01), e.clientX, e.clientY);
  }, {passive:false});
})();

function renderAll(){ renderNav(); renderStage(); renderEditor(); if (S.tab==='furn'){ renderResults(); renderSaved(); } else renderList(); }

/* ---------- 雲端更新 ---------- */
let remoteTimer=null;
function refreshFromRemote(){
  clearTimeout(remoteTimer);
  remoteTimer=setTimeout(()=>{
    if (drag && drag.on) return;
    fixSelection(); renderNav(); renderStage();
    if (!$('#editor').contains(document.activeElement)) renderEditor(); else renderReadout();
    if (S.tab==='furn'){ renderResults(); renderSaved(); } else renderList();
    if (S.screen==='lib') renderLibRemote();
  },60);
}
function applyRemote(path, doc){
  const p=String(path||'');
  if (pending.has(p) || busy.has(p)) return;                         // 這一筆本機正在改，以本機為準
  if (doc!=null && (tomb.get(p)||0)>Date.now()) return;              // 剛刪掉的，不讓晚到的舊訊息把它加回來
  applyDoc(S.data, p, doc); refreshFromRemote();
}
async function reloadAll(){
  if (loading || pending.size || inflight || (drag && drag.on)) return;
  try {
    const d=await store.load();
    if (pending.size || inflight) return;
    S.data=(d && typeof d==='object')?d:{}; mergeSeed(S.data);
    syncErr=false; setSync(); refreshFromRemote();
  } catch(e){}
}

/* ---------- 啟動 ---------- */
function showNote(t){ const el=$('#notice'); el.hidden=!t; el.textContent=t||''; }
async function connect(){
  let data;
  try { data=await store.load(); }
  catch(e){
    loading=false; syncErr=true; setSync();
    showNote('暫時連不上共用資料庫，目前顯示的是圖面原始尺寸，這時候的修改不會被儲存。會自動重試。');
    setTimeout(connect,10000); return;
  }
  S.data=(data && typeof data==='object')?data:{};
  const writes=mergeSeed(S.data);
  fixSelection(); loading=false; syncErr=false;
  for (const p of writes) flush(p);
  showNote(store.remote?'':'尚未連上共用資料庫：現在填寫的內容只會存在這台裝置的瀏覽器，其他人看不到。');
  setSync(); renderAll(); if (S.screen==='lib') renderLib();
  store.listen(applyRemote, reloadAll, ok=>{ online=ok; setSync(); });
  setTimeout(backfillThumbs, 2500);
}
(function init(){
  S.data={}; mergeSeed(S.data); fixSelection(); setSync(); renderAll(); renderFormExtras(); applyScreen(); connect();
})();
</script>
