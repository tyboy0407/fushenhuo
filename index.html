<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>富紳活 尺寸簿</title>
<meta name="description" content="新家各房間的牆面尺寸，找到喜歡的家具時馬上比對放不放得下。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：左邊是立面圖（桌機固定在畫面上），右邊是編輯與比對面板；手機改成上下排列。 */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --paper:#FAFBF9; --ink:#1B2628; --muted:#5A696C; --line:#CBD3D1;
  --accent:#0B6B78; --accent-soft:#D8EBEE; --furn:#A85F06; --furn-soft:#F8E6C9;
  --ok:#256F45; --ok-soft:#DDF0E4; --bad:#B5362A; --bad-soft:#F8DFDB;
  --struct:#39464A; --cab:#E9EEEC; --warn-soft:#FBEFD2; --warn:#7A5200;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111617; --surface:#1A2122; --paper:#151B1C; --ink:#E5EBEA; --muted:#93A2A4; --line:#313D40;
    --accent:#5FC6D3; --accent-soft:#16383E; --furn:#E8A548; --furn-soft:#3D2E14;
    --ok:#74C996; --ok-soft:#173424; --bad:#F2857A; --bad-soft:#40201C;
    --struct:#6B797C; --cab:#232C2E; --warn-soft:#3A2F12; --warn:#E9C46A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.02em}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.local::before{background:var(--furn)} .sync.error::before{background:var(--bad)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.chip.sub[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:16px;align-items:start;margin-top:12px}
.stage{position:sticky;top:10px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.toolbar .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar .sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:34px;padding:0 10px;font-size:14px}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.zoomv{font:500 13px var(--mono);min-width:44px;text-align:center;color:var(--muted)}
.scroll{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
#svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#svg.fit{max-height:calc(100vh - 150px)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 2px 0}

.panel{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:15px;margin:0 0 8px;font-weight:700}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

.ed-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{flex:none;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--surface);font:600 12.5px var(--mono)}
.tag.furn{background:var(--furn)} .tag.dim{background:var(--muted)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 9px;min-height:38px}
.fld textarea{resize:vertical;min-height:58px}
.fld input:disabled{color:var(--muted);background:var(--bg)}
.fld input[type=number]{font:500 14.5px var(--mono)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.readout{font-size:13px;color:var(--muted);margin:8px 0 0;font-variant-numeric:tabular-nums}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:7px;padding:6px 10px;font-size:13.5px;margin-top:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:10px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.danger{color:var(--bad)} .btn.danger.arm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}

.list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.li{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.li:hover{background:var(--bg)}
.li[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.li .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.li .nm.blank{color:var(--muted);font-weight:400}
.li .mt{margin-left:auto;flex:none;font:500 12.5px var(--mono);color:var(--muted);text-align:right}

.verdict-big{border-radius:8px;padding:9px 12px;font-weight:700;margin:10px 0 6px}
.verdict-big.ok{background:var(--ok-soft);color:var(--ok)} .verdict-big.no{background:var(--bad-soft);color:var(--bad)}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.slot[data-hi="1"]{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.slot-head{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-weight:500}
.slot-size{font:500 13px var(--mono);color:var(--muted)}
.vd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;margin-top:5px}
.vd.ok{color:var(--ok)} .vd.no{color:var(--bad)}
.vd .btn{margin-left:auto}
.fcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;display:flex;gap:10px;align-items:flex-start}
.fbody{flex:1;min-width:0}
.thumb{flex:none;width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--bg)}
.thumb.big{width:96px;height:96px}
.fcard .inf{font-size:13px;color:var(--muted)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line);align-self:center}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c)}
.sw.none{background:var(--furn-soft)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.fld .swc{width:40px;height:32px;min-height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.fld input[type=file]{padding:6px;font-size:13.5px}
#paneFurn:not([hidden]){display:flex;flex-direction:column}
#furnForm{order:0} #saved{order:2}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.more .grid2{margin-top:8px}
#f-photoPrev{display:flex;align-items:center;gap:10px;margin-top:6px}
.small-note.err{color:var(--bad)}
.tbtn.add{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.fcard .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fcard .t b{overflow-wrap:anywhere}
.fcard .sz{font:500 13px var(--mono);color:var(--muted)}
.pill{font-size:12.5px;border-radius:999px;padding:1px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--bad-soft);color:var(--bad)}
.fcard p{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.fcard a{color:var(--accent)}
.small-note{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* 立面圖 */
.wall{fill:var(--struct)} .room{fill:var(--paper)} .floor{stroke:var(--ink);stroke-width:1.2}
.hatch-bg{fill:var(--paper)} .hatch-ln{stroke:var(--muted);stroke-width:.55}
.it .shape{stroke:var(--ink);stroke-width:.7;fill:var(--surface)}
.it.cat-structure .shape{fill:var(--struct);stroke:var(--struct)}
.it.cat-trim .shape,.it.cat-board .shape{fill:url(#hatch)}
.it.cat-cabinet .shape{fill:var(--cab)}
.it.cat-door .shape{fill:var(--paper)}
.it.cat-furniture .shape{fill:var(--furn-soft);stroke:var(--furn);stroke-width:1}
.it.cat-furniture.has-c .shape{fill:var(--c);fill-opacity:.62;stroke:color-mix(in srgb,var(--c) 65%,var(--ink));stroke-width:1.1}
.it.cat-furniture.has-c .bdg{fill:var(--ink)}
.it.bad .shape,.it.cat-furniture.bad .shape{fill:var(--bad-soft);fill-opacity:1;stroke:var(--bad);stroke-width:1.2}
.it.sel .shape,.it.cat-furniture.sel .shape{stroke:var(--accent);stroke-width:1.8}
.it .deco{stroke:var(--muted);stroke-width:.5;fill:none}
.it .deco.dash{stroke-dasharray:5 3}
.it .bdg{fill:var(--ink);stroke:var(--paper);stroke-width:.8}
.it.cat-furniture .bdg{fill:var(--furn)}
.it.sel .bdg{fill:var(--accent)}
.it .bdt{fill:var(--paper);font:600 7.4px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.it .nmt{fill:var(--ink);font:500 7.5px var(--sans);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:2px;stroke-linejoin:round;pointer-events:none}
.it .ref{stroke:var(--muted);stroke-width:.7;stroke-dasharray:4 2.5}
.it.sel .ref{stroke:var(--accent);stroke-width:1.2}
.it .hit{stroke:transparent;stroke-width:11;fill:none}
.nml{fill:var(--ink);font:500 7.5px var(--sans);dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
.it .mk{fill:var(--paper);stroke:var(--bad);stroke-width:1}
.it.sel .mk{stroke:var(--accent);stroke-width:1.8}
.it .mkt{fill:var(--ink);font:600 6.6px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.it.sel.free{cursor:move;touch-action:none}
.it{cursor:pointer}
.dl{stroke:var(--muted);stroke-width:.5;fill:none}
.dt{stroke:var(--ink);stroke-width:.8}
.dn{fill:var(--ink);font:500 8.5px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:2.4px;stroke-linejoin:round;pointer-events:none}
.total .dn{font-weight:600}
.user .dl{stroke:var(--ink);stroke-width:.6}
.it.sel .dl,.it.sel .dt{stroke:var(--accent)} .it.sel .dn{fill:var(--accent)}
.cl .dl,.cl .dt{stroke:var(--accent)} .cl .dl{stroke-dasharray:2 1.5;stroke-width:.7} .cl .dn{fill:var(--accent);font-weight:600}
.slot-hi{fill:var(--ok);fill-opacity:.16;stroke:var(--ok);stroke-width:1;stroke-dasharray:5 3;pointer-events:none}

@media (max-width:880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{position:static}
  #svg.fit{max-height:none}
  .toolbar .meta{display:none}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.tbtn,.li{transition:background-color .12s,border-color .12s} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>富紳活 尺寸簿</h1>
    <nav id="rooms" class="chips" aria-label="房間"></nav>
    <div id="sync" class="sync" role="status">載入中…</div>
  </header>
  <div id="notice" class="notice" hidden></div>

  <main class="layout">
    <section class="stage" aria-label="立面圖">
      <div class="toolbar">
        <div id="views" class="chips" aria-label="視角"></div>
        <button id="addDecor" class="tbtn add" type="button">＋ 擺設</button>
        <span id="meta" class="meta"></span>
        <span class="sp"></span>
        <button id="btnDims" class="tbtn" type="button" aria-pressed="true">尺寸標註</button>
        <button id="zoomOut" class="tbtn" type="button" aria-label="縮小">−</button>
        <span id="zoomVal" class="zoomv">100%</span>
        <button id="zoomIn" class="tbtn" type="button" aria-label="放大">＋</button>
      </div>
      <div class="scroll" id="scroll">
        <svg id="svg" class="fit" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="牆面立面圖">
          <defs>
            <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect class="hatch-bg" width="4" height="4"/><line class="hatch-ln" x1="0" y1="0" x2="0" y2="4"/>
            </pattern>
          </defs>
          <g id="gBase"></g><g id="gItems"></g><g id="gNames"></g><g id="gDims"></g><g id="gOver"></g>
        </svg>
      </div>
      <p class="hint">單位：公分。點一下物件可選取並填寫名稱；解鎖後可直接拖曳，或用方向鍵微調。</p>
    </section>

    <aside class="panel">
      <section class="card" id="editor" aria-label="選取的物件"></section>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabItems" type="button" aria-selected="true">物件清單</button>
        <button class="tab" role="tab" id="tabFurn" type="button" aria-selected="false">擺設收藏庫</button>
      </div>
      <div id="paneItems">
        <div class="row" style="margin-top:0">
          <button class="btn" type="button" id="addBox">＋ 物件</button>
          <button class="btn" type="button" id="addDim">＋ 量測線</button>
          <button class="btn" type="button" id="addLine">＋ 參考線</button>
          <button class="btn" type="button" id="addMark">＋ 標記</button>
        </div>
        <div class="list" id="list"></div>
      </div>
      <div id="paneFurn" hidden>
        <form class="card" id="furnForm" autocomplete="off">
          <h2 id="furnTitle">新增擺設</h2>
          <label class="fld"><span>名稱</span><input id="f-name" type="text" maxlength="60" placeholder="例如：落地燈、三層櫃"></label>
          <div class="grid4" style="grid-template-columns:repeat(3,minmax(0,1fr))">
            <label class="fld"><span>寬（沿著牆）</span><input id="f-w" type="number" inputmode="decimal" min="0" step="0.5"></label>
            <label class="fld"><span>深（往外凸）</span><input id="f-d" type="number" inputmode="decimal" min="0" step="0.5"></label>
            <label class="fld"><span>高</span><input id="f-h" type="number" inputmode="decimal" min="0" step="0.5"></label>
          </div>
          <div class="fld" style="margin-top:8px"><span>顏色</span><div id="f-colors"></div></div>
          <details class="more" id="f-more">
            <summary>更多資料（選填）：價格、店家、連結、照片</summary>
            <div class="grid2">
              <label class="fld"><span>價格（元）</span><input id="f-price" type="number" inputmode="numeric" min="0" step="1"></label>
              <label class="fld"><span>店家／品牌</span><input id="f-shop" type="text" maxlength="40"></label>
            </div>
            <label class="fld" style="margin-top:8px"><span>商品連結</span><input id="f-url" type="url" inputmode="url" placeholder="https://"></label>
            <label class="fld" style="margin-top:8px"><span>備註</span><input id="f-note" type="text" maxlength="200"></label>
            <div class="fld" style="margin-top:8px" id="f-photoWrap"><span>照片</span><input id="f-photo" type="file" accept="image/*"><div id="f-photoPrev"></div></div>
          </details>
          <div class="row">
            <button class="btn primary" type="button" id="furnPlace">放到圖上</button>
            <button class="btn" type="button" id="furnSave">存進收藏庫</button>
            <button class="btn" type="button" id="furnClear">清空</button>
          </div>
          <p class="small-note" id="furnMsg" role="status"></p>
          <p class="small-note">圖上比對的是寬和高；深度會記錄下來，放到圖上後可以把寬、深互換（轉 90°）。</p>
        </form>
        <div id="results"></div>
        <div id="saved"></div>
      </div>
    </aside>
  </main>
</div>

<script src="config.js"></script>
<script>
'use strict';
/* ---------- 基本資料：各房間量到的尺寸（公分，x 從左牆起算，y 從地面起算） ---------- */
const SEED = { rooms: { study: { name:'書房', order:1, views: { door: {
  name:'面對門', order:1, width:270, height:270,
  items: {
    a:{kind:'box',cat:'trim',tag:'A',name:'',note:'圖面標示 15，位在淨高 270 的上方。',x:0,y:270,w:270,h:15,solid:false,locked:true},
    b:{kind:'box',cat:'structure',tag:'B',name:'',note:'高 46 為圖面標示；寬 30 圖上沒標，依下方櫃體對齊推定。',x:0,y:224,w:30,h:46,solid:true,locked:true},
    c:{kind:'box',cat:'cabinet',tag:'C',name:'',note:'',x:0,y:169,w:30,h:55,solid:true,locked:true},
    d:{kind:'line',tag:'D',name:'詳圖B',note:'圖面標示「詳圖B」的位置，在 C 下方 20。',x:0,y:149,len:30,dir:'h',locked:true},
    e:{kind:'box',cat:'trim',tag:'E',name:'',note:'厚 3 為圖面標示；高度圖上沒標，推定到 C 的底部。',x:0,y:0,w:3,h:169,solid:true,locked:true},
    f:{kind:'box',cat:'board',tag:'F',name:'',note:'',x:3,y:71,w:59,h:4,solid:true,locked:true},
    g:{kind:'box',cat:'door',tag:'G',name:'',note:'',x:176,y:0,w:94,h:222,solid:true,locked:true,hinge:'R'},
    h:{kind:'line',tag:'H',name:'',note:'離天花板 46 的水平線（門上方 2）。',x:30,y:224,len:240,dir:'h',locked:true},
    m1:{kind:'dim',tag:'',name:'',note:'',x:-34,y:169,len:55,dir:'v',locked:true},
    m2:{kind:'dim',tag:'',name:'',note:'',x:-34,y:75,len:94,dir:'v',locked:true},
    m3:{kind:'dim',tag:'',name:'',note:'',x:-34,y:0,len:75,dir:'v',locked:true},
    m4:{kind:'dim',tag:'',name:'',note:'',x:0,y:130,len:30,dir:'h',locked:true}
  } },
  desk: {
  name:'書桌牆', order:2, width:290, height:270, wallL:[[0,61],[224,285]],

function setAttrs(e, a){
  for (const [k,v] of Object.entries(a||{})){
    if (v==null || v===false) continue;
    if (k==='class') e.setAttribute('class', v);
    else if (k==='text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (typeof v==='boolean') e[k] = v;
    else e.setAttribute(k, v);
  }
}
function h(tag, a, ...kids){ const e=document.createElement(tag); setAttrs(e,a); e.append(...kids.filter(k=>k!=null)); return e; }
function s(tag, a, ...kids){ const e=document.createElementNS(NS,tag); setAttrs(e,a); e.append(...kids.filter(k=>k!=null)); return e; }
const clone = o => JSON.parse(JSON.stringify(o));
const okColor = c => /^#[0-9a-fA-F]{6}$/.test(c||'') ? c : '';
const n = v => { const x=Number(v); return Number.isFinite(x)?x:0; };
const r1 = v => Math.round(v*10)/10;
const fmt = v => String(r1(v));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function getAt(root, path){ let o=root; for (const k of path.split('/').filter(Boolean)){ if (o==null) return undefined; o=o[k]; } return o; }
function setAt(root, segs, val){
  let o=root;
  for (let i=0;i<segs.length-1;i++){
    if (typeof o[segs[i]]!=='object' || o[segs[i]]===null){ if (val==null) return; o[segs[i]]={}; }
    o=o[segs[i]];
  }
  const k=segs[segs.length-1];
  if (val==null) delete o[k]; else o[k]=val;
}

/* ---------- 儲存層：有設定 Supabase 就存雲端，否則存在這台裝置 ----------
   雲端資料表 fushenhuo_docs 一列存一個房間、一個視角、一個物件或一件家具，
   path 是它在資料裡的位置（例如 rooms/study/views/door/items/c）。 */
function applyDoc(root, path, doc){
  const segs=String(path||'').split('/').filter(Boolean); if (!segs.length) return;
  if (doc!==null && typeof doc!=='object') doc=null;
  const meta = segs[0]==='rooms' && (segs.length===2 || segs.length===4);
  if (!meta || doc===null){ setAt(root, segs, doc); return; }
  let o=root;
  for (const k of segs){ if (typeof o[k]!=='object' || o[k]===null) o[k]={}; o=o[k]; }
  const keep = segs.length===2 ? 'views' : 'items';
  for (const k of Object.keys(o)) if (k!==keep) delete o[k];
  for (const [k,v] of Object.entries(doc)) if (k!==keep) o[k]=v;
}
function flattenDoc(path, value){
  const p=path.split('/'), out=[];
  if (value==null) return [[path,null]];
  if (p[0]==='rooms' && p.length===2){
    const meta=Object.assign({},value); delete meta.views; out.push([path,meta]);
    for (const [vid,v] of Object.entries(value.views||{})) out.push(...flattenDoc(path+'/views/'+vid, v));
  } else if (p[0]==='rooms' && p.length===4){
    const meta=Object.assign({},value); delete meta.items; out.push([path,meta]);
    for (const [id,it] of Object.entries(value.items||{})) out.push([path+'/items/'+id, it]);
  } else out.push([path,value]);
  return out;
}
const store = (function(){
  const cfg=window.SITE_CONFIG||{};
  const url=String(cfg.supabaseUrl||'').trim().replace(/\/+$/,''), key=String(cfg.supabaseKey||'').trim();
  const remote=!!(url && key);
  const LS='fushenhuo-data-v1', TABLE='fushenhuo_docs', BUCKET='fushenhuo-photos';
  const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js';
  let sb=null;
  function client(){
    if (sb) return Promise.resolve(sb);
    return new Promise((res,rej)=>{
      if (window.supabase) return res();
      const el=document.createElement('script'); el.src=LIB; el.onload=()=>res(); el.onerror=()=>{ el.remove(); rej(new Error('library')); };
      document.head.append(el);
    }).then(()=>{ sb=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}); return sb; });
  }
  return {
    remote,
    async load(){
      if (!remote){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } }
      const c=await client();
      const {data,error}=await c.from(TABLE).select('path,data');
      if (error) throw error;
      const root={};
      for (const row of data||[]) applyDoc(root, row.path, row.data);
      return root;
    },
    async set(path, value){
      if (!remote){ try { localStorage.setItem(LS, JSON.stringify(S.data)); } catch(e){} return; }
      const c=await client(), docs=flattenDoc(path,value), now=new Date().toISOString();
      const up=docs.filter(d=>d[1]!=null).map(d=>({path:d[0],data:d[1],updated_at:now})), del=docs.filter(d=>d[1]==null).map(d=>d[0]);
      if (up.length){ const {error}=await c.from(TABLE).upsert(up); if (error) throw error; }
      if (del.length){ const {error}=await c.from(TABLE).delete().in('path',del); if (error) throw error; }
    },
    photoUrl(p){ return remote && /^[\w.-]+$/.test(p||'') ? url+'/storage/v1/object/public/'+BUCKET+'/'+p : ''; },
    async uploadPhoto(blob, name){
      const c=await client();
      const {data,error}=await c.storage.from(BUCKET).upload(name, blob, {contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
      if (error) throw error;
      return (data && data.path) || name;
    },
    async removePhoto(p){ try { const c=await client(); await c.storage.from(BUCKET).remove([p]); } catch(e){} },
    listen(onDoc, onReload, onState){
      if (!remote || !sb) return;
      let wasDown=false;
      sb.channel('fushenhuo-docs')
        .on('postgres_changes',{event:'*',schema:'public',table:TABLE}, p=>{
          if (p.eventType==='DELETE'){ if (p.old && p.old.path) onDoc(p.old.path,null); }
          else if (p.new && p.new.path) onDoc(p.new.path,p.new.data);
        })
        .subscribe(status=>{
          if (status==='SUBSCRIBED'){ onState(true); if (wasDown){ wasDown=false; onReload(); } }
          else { wasDown=true; onState(false); }
        });
      // 手機從背景回來時連線可能斷過，重新抓一次最新資料
      document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) onReload(); });
    }
  };
})();

let syncErr=false, inflight=0, online=true, loading=store.remote;
const pending = new Map();
function setSync(){
  const el=$('#sync'); let cls='ok', txt='已同步，所有人可見';
  if (!store.remote){ cls='local'; txt='只存在這台裝置'; }
  else if (loading){ cls=''; txt='連線中…'; }
  else if (syncErr || !online){ cls='error'; txt='連線中斷，重新連線中…'; }
  else if (pending.size || inflight){ cls=''; txt='儲存中…'; }
  el.className='sync '+cls; el.textContent=txt;
}
function save(path){
  clearTimeout(pending.get(path));
  pending.set(path, setTimeout(()=>{ pending.delete(path); flush(path); }, 350));
  setSync();
}
async function flush(path){
  inflight++;
  try { await store.set(path, getAt(S.data, path)); syncErr=false; } catch(e){ syncErr=true; }
  inflight--; setSync();
}
function mergeSeed(data){
  const writes=[];
  if (!data.rooms) data.rooms={};
  for (const [rid,room] of Object.entries(SEED.rooms)){
    if (!data.rooms[rid]){ data.rooms[rid]=clone(room); writes.push('rooms/'+rid); continue; }
    const dr=data.rooms[rid]; if (!dr.views) dr.views={};
    for (const [vid,v] of Object.entries(room.views))
      if (!okView(dr.views[vid])){ dr.views[vid]=clone(v); writes.push('rooms/'+rid+'/views/'+vid); }
  }
  return writes;
}
// 只顯示資料完整的房間與視角（雲端資料分批抵達時，尺寸還沒到的先不顯示）
const sorted = o => Object.entries(o).filter(e=>e[1] && typeof e[1]==='object').sort((a,b)=>n(a[1].order)-n(b[1].order));
const okView = v => !!v && n(v.width)>0 && n(v.height)>0;
const viewsOf = r => sorted((r && r.views)||{}).filter(e=>okView(e[1]));
const roomsOf = () => sorted(S.data.rooms||{}).filter(e=>viewsOf(e[1]).length);
function fixSelection(){
  let rooms=roomsOf();
  if (!rooms.length){ mergeSeed(S.data); rooms=roomsOf(); }
  if (!rooms.some(e=>e[0]===S.room)) S.room=rooms[0][0];
  const views=viewsOf(S.data.rooms[S.room]);
  if (!views.some(e=>e[0]===S.view)) S.view=views[0][0];
  if (S.sel && !items()[S.sel]) S.sel=null;
}

/* ---------- 取資料 ---------- */
const view = () => S.data.rooms[S.room].views[S.view];
const items = () => { const v=view(); if (!v.items) v.items={}; return v.items; };
const itemPath = id => 'rooms/'+S.room+'/views/'+S.view+'/items/'+id;
function geo(it){
  if (it.kind==='box') return {x:n(it.x),y:n(it.y),w:Math.max(0,n(it.w)),h:Math.max(0,n(it.h))};
  if (it.kind==='mark') return {x:n(it.x),y:n(it.y),w:0,h:0};
  const len=Math.max(0,n(it.len));
  return {x:n(it.x),y:n(it.y),w:it.dir==='h'?len:0,h:it.dir==='v'?len:0};
}
const labelOf = it => it.name ? it.tag+'・'+it.name : (KIND_NAME[it.kind]||'物件')+' '+it.tag;
function nextTag(){
  const used=new Set(Object.values(items()).map(i=>i.tag));
  for (const c of 'ABCDEFGHJKLMNPQRSTUVWXYZ') if (!used.has(c)) return c;
  let k=1; while (used.has('#'+k)) k++; return '#'+k;
}
// exclude 可以是一個物件 id，或一個判斷「要略過誰」的函式
const solids = (v, exclude) => Object.entries(v.items||{}).filter(([id,i])=>i && i.kind==='box' && i.solid &&
  !(typeof exclude==='function' ? exclude(id,i) : id===exclude));
function problems(id, it){
  if (it.kind!=='box' || it.cat!=='furniture') return [];
  const v=view(), g=geo(it), out=[];
  if (g.x<0 || g.y<0 || g.x+g.w>v.width || g.y+g.h>v.height) out.push('超出這面牆的範圍');
  for (const [oid,o] of solids(v,id)){ const q=geo(o);
    if (g.x<q.x+q.w && g.x+g.w>q.x && g.y<q.y+q.h && g.y+g.h>q.y) out.push('和「'+labelOf(o)+'」重疊'); }
  return out;
}
function clearances(id, it){
  const v=view(), g=geo(it); let L=0,R=v.width,D=0,U=v.height;
  for (const [,o] of solids(v,id)){ const q=geo(o);
    if (q.y<g.y+g.h && q.y+q.h>g.y){ if (q.x+q.w<=g.x) L=Math.max(L,q.x+q.w); if (q.x>=g.x+g.w) R=Math.min(R,q.x); }
    if (q.x<g.x+g.w && q.x+q.w>g.x){ if (q.y+q.h<=g.y) D=Math.max(D,q.y+q.h); if (q.y>=g.y+g.h) U=Math.min(U,q.y); }
  }
  return {L,R,D,U};
}

function drawDim(g,x1,y1,x2,y2,label,cls){
  const grp=s('g',{class:cls||''}), vert=x1===x2;
  grp.append(s('line',{x1,y1,x2,y2,class:'dl'}));
  for (const [x,y] of [[x1,y1],[x2,y2]]) grp.append(s('line',{x1:x-1.8,y1:y+1.8,x2:x+1.8,y2:y-1.8,class:'dt'}));
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  grp.append(vert ? s('text',{x:mx-2.8,y:my,transform:'rotate(-90 '+(mx-2.8)+' '+my+')',class:'dn',text:label})
                  : s('text',{x:mx,y:my-2.8,class:'dn',text:label}));
  g.append(grp); return grp;
}
// 估計文字寬度（圖上的單位是公分）：中文字約 7.6，英數約 4.3
const textW = t => [...t].reduce((a,ch)=>a+(ch.charCodeAt(0)>255?7.6:4.3),0);
// 物件的名稱：放得進物件裡就放在代號下方，放不進就接在代號旁邊；靠右牆時改放左邊
function nameLabel(id, name, x, y, below, W){
  let t=String(name).trim(); if (!t) return null;
  if ([...t].length>16) t=[...t].slice(0,15).join('')+'…';
  if (below) return s('text',{class:'nml','data-lab':id,x,y,style:'text-anchor:middle',text:t});
  const right=x+9+textW(t)<=W+6;
  return s('text',{class:'nml','data-lab':id,x:right?x+9:x-9,y,style:'text-anchor:'+(right?'start':'end'),text:t});
}
function drawItem(id, it){
  const v=view(), H=v.height, W=v.width, g=geo(it), sel=S.sel===id;
  const cls=['it','kind-'+it.kind]; if (it.kind==='box') cls.push('cat-'+(CATS[it.cat]?it.cat:'other'));
  if (sel) cls.push('sel'); if (sel && !it.locked) cls.push('free'); if (problems(id,it).length) cls.push('bad');
  const col=it.kind==='box' && it.cat==='furniture' ? okColor(it.color) : '';
  if (col) cls.push('has-c');
  const grp=s('g',{class:cls.join(' '),'data-id':id,style:col?'--c:'+col:null});
  const cx=g.x+g.w/2, cy=H-(g.y+g.h/2);
  if (it.kind==='box'){
    const top=H-(g.y+g.h);
    grp.append(s('rect',{class:'shape',x:g.x,y:top,width:g.w,height:g.h}));
    if (it.cat==='door' && g.w>=20 && g.h>=40){
      const hx=it.hinge==='L'?g.x:g.x+g.w, fx=it.hinge==='L'?g.x+g.w:g.x, hand=it.hinge==='L'?g.x+g.w-9:g.x+7;
      grp.append(s('path',{class:'deco dash',d:'M'+fx+' '+top+' L'+hx+' '+(top+g.h/2)+' L'+fx+' '+(top+g.h)}));
      grp.append(s('rect',{class:'deco',x:hand,y:H-g.y-112,width:2,height:14,rx:1}));
    }
    const nm=String(it.name||'').trim(), inside=!!nm && g.w>=textW(nm)+6 && g.h>=26;
    // bx、by：代號圓點離物件中心的偏移，避免被疊在上面的小物件蓋住
    const bx=cx+n(it.bx), by=cy-n(it.by);
    grp.append(s('circle',{class:'bdg',cx:bx,cy:inside?by-6:by,r:6}));
    grp.append(s('text',{class:'bdt',x:bx,y:inside?by-6:by,text:it.tag}));
    grp._lab=inside ? nameLabel(id,nm,bx,by+7,true,W) : nameLabel(id,nm,bx,by,false,W);
  } else if (it.kind==='mark'){
    grp.append(s('rect',{class:'mk',x:cx-4.8,y:cy-4.8,width:9.6,height:9.6,rx:1.6}));
    grp.append(s('text',{class:'mkt',x:cx,y:cy,text:it.tag}));
    grp._lab=nameLabel(id,it.name||'',cx,cy,false,W);
  } else {
    const x1=g.x, y1=H-g.y, x2=g.x+g.w, y2=H-(g.y+g.h);
    if (it.kind==='line'){
      grp.append(s('line',{class:'ref',x1,y1,x2,y2}));
      // 短的參考線把代號放在線尾外側，避免蓋住旁邊的尺寸數字
      const short=n(it.len)<60, bx=short?(it.dir==='h'?x2+8:cx):cx, by=short?(it.dir==='v'?y2-8:cy):cy;
      grp.append(s('circle',{class:'bdg',cx:bx,cy:by,r:6}));
      grp.append(s('text',{class:'bdt',x:bx,y:by,text:it.tag}));
      grp._lab=nameLabel(id,it.name||'',bx,by,false,W);
    } else drawDim(grp,x1,y1,x2,y2,fmt(n(it.len)),'user');
    grp.append(s('line',{class:'hit',x1,y1,x2,y2}));
  }
  return grp;
}
function renderStage(){
  const v=view(), W=v.width, H=v.height, list=Object.entries(items());
  const ext=Math.max(0,...list.map(([,i])=>{ if (i.kind!=='box') return 0; const g=geo(i); return g.y+g.h-H; }));
  let minX=0, maxX=W, minY=0;
  for (const [,i] of list){ if (i.kind!=='dim') continue; const g=geo(i); minX=Math.min(minX,g.x); maxX=Math.max(maxX,g.x+g.w); minY=Math.min(minY,g.y); }
  LAY.totalX=Math.min(-50,minX-16); LAY.totalY=H+Math.max(30,15-minY);
  const ML=13-LAY.totalX, MR=Math.max(28,maxX-W+10), MT=ext+18, MB=LAY.totalY-H+8;
  svgEl.setAttribute('viewBox',[-ML,-MT,W+ML+MR,H+MT+MB].join(' '));
  const wall=(x,segs)=>(Array.isArray(segs) && segs.length ? segs : [[0,H+ext]]).map(q=>
    s('rect',{class:'wall',x,y:H-Math.max(n(q[0]),n(q[1])),width:7,height:Math.abs(n(q[1])-n(q[0]))}));
  svgEl.style.width=(S.zoom*100)+'%'; svgEl.classList.toggle('fit',S.zoom===1);
  gBase.replaceChildren(
    ...wall(-7,v.wallL), ...wall(W,v.wallR),
    s('rect',{class:'wall',x:-7,y:-ext-7,width:W+14,height:7}),
    s('rect',{class:'room',x:0,y:0,width:W,height:H}),
    s('line',{class:'floor',x1:-7,y1:H,x2:W+7,y2:H}));
  list.sort((a,b)=>{ const ka=KIND_ORDER[a[1].kind]||0, kb=KIND_ORDER[b[1].kind]||0; if (ka!==kb) return ka-kb;
    const ga=geo(a[1]), gb=geo(b[1]); return gb.w*gb.h-ga.w*ga.h; });
  const groups=list.map(([id,it])=>drawItem(id,it));
  gItems.replaceChildren(...groups);
  gNames.replaceChildren(...groups.map(q=>q._lab).filter(Boolean));
  renderDims(); renderOver();
  $('#meta').textContent='牆寬 '+fmt(W)+' × 淨高 '+fmt(H);
  $('#zoomVal').textContent=Math.round(S.zoom*100)+'%';
}
const LAY={totalX:-50,totalY:300};
function chain(edges){ const a=[...new Set(edges.map(r1))].sort((p,q)=>p-q); return a.slice(1).map((b,i)=>[a[i],b]); }
function renderDims(){
  gDims.replaceChildren(); if (!S.showDims) return;
  const v=view(), W=v.width, H=v.height, L=[0,H], R=[0,H], B=[0,W];
  for (const it of Object.values(items())){
    if (it.kind==='dim' || it.kind==='mark' || it.nochain) continue;
    const g=geo(it), side=typeof it.side==='string' ? it.side : (g.x+g.w/2<=W/2 ? 'L' : 'R');
    // 擺上去的家具只影響底部的寬度標註，左右兩側保留圖面原本的高度標註
    if (it.cat!=='furniture'){ if (side.includes('L')) L.push(g.y,g.y+g.h); if (side.includes('R')) R.push(g.y,g.y+g.h); }
    if (g.y+g.h/2<=H/2 || it.cat==='furniture') B.push(g.x,g.x+g.w);
  }
  const cl=chain(L), cr=chain(R);
  if (cl.length>1) for (const [a,b] of cl) drawDim(gDims,-18,H-a,-18,H-b,fmt(b-a));
  if (cr.length>1) for (const [a,b] of cr) drawDim(gDims,W+20,H-a,W+20,H-b,fmt(b-a));
  for (const [a,b] of chain(B)) drawDim(gDims,a,H+14,b,H+14,fmt(b-a));
  drawDim(gDims,LAY.totalX,H,LAY.totalX,0,fmt(H),'total');
  drawDim(gDims,0,LAY.totalY,W,LAY.totalY,fmt(W),'total');
}
function renderOver(){
  gOver.replaceChildren();
  const v=view(), H=v.height;
  if (S.tab==='furn' && S.slotHi){ const q=S.slotHi;
    gOver.append(s('rect',{class:'slot-hi',x:q.x1,y:H-q.y2,width:q.x2-q.x1,height:q.y2-q.y1})); }
  const it=S.sel && items()[S.sel];
  if (!it || it.kind!=='box') return;
  const g=geo(it); if (g.y>=H) return;
  const c=clearances(S.sel,it), my=H-(g.y+g.h/2), mx=g.x+g.w/2;
  if (g.x-c.L>0) drawDim(gOver,c.L,my,g.x,my,fmt(g.x-c.L),'cl');
  if (c.R-(g.x+g.w)>0) drawDim(gOver,g.x+g.w,my,c.R,my,fmt(c.R-g.x-g.w),'cl');
  if (g.y-c.D>0) drawDim(gOver,mx,H-c.D,mx,H-g.y,fmt(g.y-c.D),'cl');
  if (c.U-(g.y+g.h)>0) drawDim(gOver,mx,H-(g.y+g.h),mx,H-c.U,fmt(c.U-g.y-g.h),'cl');
}

/* ---------- 拖曳 ---------- */
let drag=null;
function snap(id, it, x, y){
  const v=view(), g=geo(it), T=2.5; if (it.kind!=='box') return [x,y];
  const xs=[0,v.width-g.w], ys=[0,v.height-g.h];
  for (const [,o] of solids(v,id)){ const q=geo(o); xs.push(q.x+q.w,q.x-g.w,q.x,q.x+q.w-g.w); ys.push(q.y+q.h,q.y-g.h,q.y,q.y+q.h-g.h); }
  const near=(val,arr)=>{ let best=val,d=T; for (const c of arr){ const dd=Math.abs(c-val); if (dd<d){ d=dd; best=c; } } return best; };
  return [near(x,xs), near(y,ys)];
}
svgEl.addEventListener('pointerdown', e=>{
  if (e.button) return;
  const g=e.target.closest('[data-id]'), id=g?g.dataset.id:null, it=id && items()[id];
  drag={id,sx:e.clientX,sy:e.clientY,moved:false,on:false};
  if (it && id===S.sel && !it.locked){
    const m=svgEl.getScreenCTM();
    Object.assign(drag,{on:true,g,lab:[...gNames.children].find(q=>q.dataset.lab===id)||null,ox:n(it.x),oy:n(it.y),k:m?1/m.a:1});
    try { svgEl.setPointerCapture(e.pointerId); } catch(err){}
  }
});
svgEl.addEventListener('pointermove', e=>{
  if (!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if (Math.hypot(dx,dy)>4) drag.moved=true;
  if (!drag.on || !drag.moved) return;
  const it=items()[drag.id]; if (!it) return;
  const [nx,ny]=snap(drag.id,it,Math.round(drag.ox+dx*drag.k),Math.round(drag.oy-dy*drag.k));
  it.x=nx; it.y=ny;
  const tf='translate('+(nx-drag.ox)+' '+(drag.oy-ny)+')';
  drag.g.setAttribute('transform',tf); if (drag.lab) drag.lab.setAttribute('transform',tf);
  drag.g.classList.toggle('bad',problems(drag.id,it).length>0);
  renderDims(); renderOver(); renderReadout();
});
function endDrag(e){

/* ---------- 擺設：比對空位、放到圖上、收藏庫 ---------- */
function computeSlots(v, exclude){
  const W=v.width, H=v.height;
  const obs=solids(v,exclude).map(([,it])=>{ const g=geo(it);
    return {it,x1:Math.max(0,g.x),x2:Math.min(W,g.x+g.w),y1:Math.max(0,g.y),y2:Math.min(H,g.y+g.h)}; }).filter(o=>o.x2>o.x1 && o.y2>o.y1);
  const xs=[...new Set([0,W,...obs.flatMap(o=>[o.x1,o.x2])])].sort((a,b)=>a-b);
  const sups=[{y:0,x1:0,x2:W,it:null}];
  for (const o of obs) if (SUPPORT_CATS.includes(o.it.cat) && o.y2<H) sups.push({y:o.y2,x1:o.x1,x2:o.x2,it:o.it});
  const out=[];
  for (const sp of sups){
    const xr=xs.filter(x=>x>=sp.x1 && x<=sp.x2), cand=[];
    for (let i=0;i<xr.length;i++) for (let j=i+1;j<xr.length;j++){
      const a=xr[i], b=xr[j]; let top=H, cap=null, blocked=false;
      for (const o of obs){
        if (o.x2<=a || o.x1>=b || o.y2<=sp.y) continue;
        if (o.y1<=sp.y){ blocked=true; break; }
        if (o.y1<top){ top=o.y1; cap=o.it; }
      }
      if (blocked || top-sp.y<8 || b-a<8) continue;
      cand.push({x1:a,x2:b,y1:sp.y,y2:top,sup:sp.it,cap});
    }
    for (const c of cand)
      if (!cand.some(d=>d!==c && d.x1<=c.x1 && d.x2>=c.x2 && d.y2>=c.y2 && (d.x1<c.x1 || d.x2>c.x2 || d.y2>c.y2))) out.push(c);
  }
  return out.sort((p,q)=>p.y1-q.y1 || p.x1-q.x1);
}
function fits(q, w, hh){ const dw=r1(q.x2-q.x1-w), dh=r1(q.y2-q.y1-hh); return {ok:dw>=0 && dh>=0, dw, dh}; }
function orientations(f){
  const o=[{key:'w',label:'正面靠牆（佔寬 '+fmt(f.w)+'）',w:f.w}];
  if (f.d>0 && f.d!==f.w) o.push({key:'d',label:'側面靠牆（佔寬 '+fmt(f.d)+'）',w:f.d});
  return o;
}
const COLORS=['#C98B2B','#B5523B','#8B5E3C','#7A8F3C','#2F8F83','#3F6FB5','#7B5EA7','#8A8F94','#3B3F45','#E4DCCB'];
function swatches(cur, onPick){
  cur=okColor(cur).toUpperCase();
  const wrap=h('div',{class:'swatches'});
  wrap.append(h('button',{class:'sw none',type:'button',title:'預設','aria-label':'預設顏色','aria-pressed':String(!cur),onclick:()=>onPick('')}));
  for (const c of COLORS) wrap.append(h('button',{class:'sw',type:'button',style:'--c:'+c,'aria-label':'顏色 '+c,'aria-pressed':String(cur===c),onclick:()=>onPick(c)}));
  wrap.append(h('input',{class:'swc',type:'color',value:cur||COLORS[0],title:'自訂顏色','aria-label':'自訂顏色',onchange:e=>onPick(e.target.value)}));
  return wrap;
}
const FKEYS=['name','w','d','h','price','shop','url','note'];
const emptyDraft=()=>({id:null,name:'',w:'',d:'',h:'',color:'',price:'',shop:'',url:'',note:'',photo:'',file:null});
function setMsg(t, err){ const el=$('#furnMsg'); el.textContent=t||''; el.classList.toggle('err',!!err); }
function draftDims(){ const d=S.draft, w=parseFloat(d.w), hh=parseFloat(d.h), dd=parseFloat(d.d);
  return (w>0 && hh>0) ? {w:r1(w),h:r1(hh),d:dd>0?r1(dd):0} : null; }
// 放到圖上或存進收藏庫，寬、深、高三個都要填
function draftSpec(){
  const f=draftDims();
  if (!f || !(f.d>0)){
    setMsg('請先填寫寬、深、高（公分）。',true);
    const miss=['w','d','h'].find(k=>!(parseFloat(S.draft[k])>0)); if (miss) $('#f-'+miss).focus();
    return null;
  }
  return {name:S.draft.name.trim(),w:f.w,d:f.d,h:f.h,color:okColor(S.draft.color),fid:S.draft.id||''};
}
const sameFid = fid => fid ? (id,i)=>i.fid===fid : null;
function renderResults(){
  const box=$('#results'), v=view(), f=draftDims();
  const slots=computeSlots(v, sameFid(S.draft.id));
  const kids=[];
  if (f){
    const okN=slots.filter(q=>orientations(f).some(o=>fits(q,o.w,f.h).ok)).length;
    kids.push(h('div',{class:'verdict-big '+(okN?'ok':'no'),
      text: okN ? '放得下：這面牆有 '+okN+' 個位置可以放' : '放不下：這面牆沒有夠大的位置'}));
  } else kids.push(h('h2',{style:'font-size:15px;margin:14px 0 2px',text:'這面牆目前的空位'}));
  if (!slots.length) kids.push(h('p',{class:'empty',text:'這面牆沒有可用的空位。'}));
  slots.forEach((q,i)=>{
    const where=(q.sup?'「'+labelOf(q.sup)+'」上方':'地面')+'・離左牆 '+fmt(q.x1)+'–'+fmt(q.x2);
    const hi=S.slotHi && S.slotHi.x1===q.x1 && S.slotHi.x2===q.x2 && S.slotHi.y1===q.y1 && S.slotHi.y2===q.y2;
    const card=h('div',{class:'slot','data-hi':hi?'1':'0'},
      h('button',{class:'slot-head',type:'button',text:'位置 '+(i+1)+'：'+where,
        onclick:()=>{ S.slotHi=hi?null:q; renderOver(); renderResults(); }}),
      h('div',{class:'slot-size',text:'可用 寬 '+fmt(q.x2-q.x1)+' × 高 '+fmt(q.y2-q.y1)+(q.cap?'（上方是 '+labelOf(q.cap)+'）':'（上方到天花板）')}));
    if (f) for (const o of orientations(f)){
      const r=fits(q,o.w,f.h);
      const why = r.ok ? '放得下，寬還剩 '+fmt(r.dw)+'、高還剩 '+fmt(r.dh)
        : '放不下，'+[r.dw<0?'寬多 '+fmt(-r.dw):'', r.dh<0?'高多 '+fmt(-r.dh):''].filter(Boolean).join('、');
      card.append(h('div',{class:'vd '+(r.ok?'ok':'no')}, h('span',{text:o.label+'：'+why}),
        r.ok ? h('button',{class:'btn small',type:'button',text:'擺上去看看',onclick:()=>{ const sp=draftSpec(); if (sp) placeItem(sp,q,o.w); }}) : null));
    }
    kids.push(card);
  });
  box.replaceChildren(...kids);
  box.style.order=f?'1':'3';
}
// 把一件擺設放到目前這面牆上；沒指定位置時找一個放得下的空位，找不到就放在地面中間
function placeItem(spec, q, wUsed){
  const v=view(), id=uid('p'), w=wUsed||spec.w, d=(wUsed && wUsed!==spec.w) ? spec.w : spec.d;
  if (!q){
    const fit=computeSlots(v,null).filter(c=>fits(c,w,spec.h).ok).sort((a,b)=>a.y1-b.y1 || (b.x2-b.x1)-(a.x2-a.x1));
    q=fit[0] || {x1:r1(Math.max(0,(v.width-w)/2)),y1:0};
  }
  items()[id]={kind:'box',cat:'furniture',fid:spec.fid||'',tag:nextTag(),name:spec.name||'',note:'',x:q.x1,y:q.y1,w,h:spec.h,d:d||0,color:spec.color||'',solid:true,locked:false};
  save(itemPath(id)); S.sel=id; S.slotHi=null; renderAll();
  $('#scroll').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function shrinkImage(file, max){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,(max||1280)/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('image')); };
    img.src=u;
  });
}
async function saveDraft(){
  const sp=draftSpec(); if (!sp) return null;
  const d=S.draft, id=d.id||uid('f');
  if (!S.data.furniture) S.data.furniture={};
  const old=S.data.furniture[id];
  let photo=d.photo||'', photoErr=false;
  if (d.file){
    setMsg('照片上傳中…');
    try { photo=await store.uploadPhoto(await shrinkImage(d.file), id+'-'+Date.now().toString(36)+'.jpg'); }
    catch(e){ photoErr=true; photo=old ? old.photo||'' : ''; }
  }
  if (old && old.photo && old.photo!==photo) store.removePhoto(old.photo);
  const url=/^https?:\/\//i.test(d.url.trim())?d.url.trim():'', price=parseFloat(d.price);
  const rec={name:sp.name||'未命名擺設',w:sp.w,d:sp.d,h:sp.h,color:sp.color,price:price>=0?price:'',shop:d.shop.trim(),url,note:d.note.trim(),photo,ts:old?old.ts:Date.now()};
  S.data.furniture[id]=rec; save('furniture/'+id);
  // 已經放在各面牆上的同一件擺設，名稱、顏色、尺寸跟著更新
  for (const [rid,room] of Object.entries(S.data.rooms)) for (const [vid,v] of Object.entries(room.views||{}))
    for (const [pid,p] of Object.entries(v.items||{})){
      if (!p || p.fid!==id) continue;
      const turned=old && n(old.d)>0 && n(p.w)===n(old.d) && n(old.w)!==n(old.d);
      p.name=rec.name; p.color=rec.color; p.h=rec.h; p.w=turned?rec.d:rec.w; p.d=turned?rec.w:rec.d;
      save('rooms/'+rid+'/views/'+vid+'/items/'+pid);
    }
  return {id, photoErr, isNew:!old};
}
function renderFormExtras(){
  const d=S.draft;
  $('#f-colors').replaceChildren(swatches(d.color, c=>{ d.color=c; renderFormExtras(); }));
  const prev=$('#f-photoPrev'), src=d.file ? (d.fileUrl||(d.fileUrl=URL.createObjectURL(d.file))) : store.photoUrl(d.photo);
  prev.replaceChildren();
  if (src) prev.append(h('img',{class:'thumb big',src,alt:'擺設照片'}),
    h('button',{class:'btn small',type:'button',text:'移除照片',onclick:()=>{ if (d.fileUrl) URL.revokeObjectURL(d.fileUrl); d.file=null; d.fileUrl=''; d.photo=''; $('#f-photo').value=''; renderFormExtras(); }}));
  $('#f-photoWrap').hidden=!store.remote;
}
function loadDraft(id){
  const f=id && S.data.furniture && S.data.furniture[id];
  if (S.draft.fileUrl) URL.revokeObjectURL(S.draft.fileUrl);
  S.draft = f ? {id,name:f.name||'',w:String(f.w),d:f.d?String(f.d):'',h:String(f.h),color:okColor(f.color),price:f.price===''||f.price==null?'':String(f.price),
                 shop:f.shop||'',url:f.url||'',note:f.note||'',photo:f.photo||'',file:null} : emptyDraft();
  for (const k of FKEYS) $('#f-'+k).value=S.draft[k];
  $('#f-photo').value='';
  $('#furnTitle').textContent=f?'編輯：'+f.name:'新增擺設';
  $('#furnSave').textContent=f?'更新收藏庫':'存進收藏庫';
  $('#f-more').open=!!(f && (f.price!==''&&f.price!=null || f.shop || f.url || f.note || f.photo));
  setMsg(''); renderFormExtras();
  S.slotHi=null; renderOver(); renderResults(); renderSaved();
}
function armDelete(e, label, run){
  const b=e.currentTarget;
  if (!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='確定刪除？'; setTimeout(()=>{ b.classList.remove('arm'); b.textContent=label; },3000); return; }
  run();
}
function renderSaved(){
  const box=$('#saved'), v=view();
  const all=Object.entries(S.data.furniture||{}).filter(e=>e[1] && typeof e[1]==='object').sort((a,b)=>n(b[1].ts)-n(a[1].ts));
  const kids=[h('h2',{style:'font-size:15px;margin:16px 0 2px',text:'收藏庫（'+all.length+'）'})];
  if (!all.length) kids.push(h('p',{class:'empty',text:'收藏庫還是空的。在上面填好資料按「存進收藏庫」，之後隨時可以放到任何一面牆上，大家也都看得到。'}));
  for (const [id,f] of all){
    const slots=computeSlots(v,sameFid(id));
    const okN=slots.filter(q=>orientations(f).some(o=>fits(q,o.w,f.h).ok)).length;
    const info=[]; if (f.price!=='' && f.price!=null && n(f.price)>=0) info.push('NT$ '+n(f.price).toLocaleString('zh-TW')); if (f.shop) info.push(f.shop);
    const body=h('div',{class:'fbody'},
      h('div',{class:'t'}, okColor(f.color)?h('span',{class:'dot',style:'--c:'+okColor(f.color)}):null, h('b',{text:f.name}),
        h('span',{class:'sz',text:'寬 '+fmt(f.w)+(f.d?' × 深 '+fmt(f.d):'')+' × 高 '+fmt(f.h)})),
      h('div',{class:'t',style:'margin-top:3px'}, info.length?h('span',{class:'inf',text:info.join('・')}):null,
        h('span',{class:'pill '+(okN?'ok':'no'),text:okN?'這面牆可放 '+okN+' 處':'這面牆放不下'})));
    if (f.note) body.append(h('p',{text:f.note}));
    if (/^https?:\/\//i.test(f.url||'')) body.append(h('p',{}, h('a',{href:f.url,target:'_blank',rel:'noopener noreferrer',text:'開啟商品頁'})));
    body.append(h('div',{class:'row',style:'margin-top:6px'},
      h('button',{class:'btn small primary',type:'button',text:'放到圖上',onclick:()=>placeItem({name:f.name,w:n(f.w),d:n(f.d),h:n(f.h),color:okColor(f.color),fid:id})}),
      h('button',{class:'btn small',type:'button',text:S.draft.id===id?'編輯中':'編輯／比對',onclick:()=>{ loadDraft(id); $('#furnForm').scrollIntoView({block:'nearest',behavior:'smooth'}); }}),
      h('button',{class:'btn small danger',type:'button',text:'刪除',onclick:e=>armDelete(e,'刪除',()=>{
        if (f.photo) store.removePhoto(f.photo);
        delete S.data.furniture[id]; save('furniture/'+id);
        if (S.draft.id===id) loadDraft(null); else renderSaved();
      })})));
    const src=store.photoUrl(f.photo);
    kids.push(h('div',{class:'fcard'}, src?h('img',{class:'thumb',src,alt:'',loading:'lazy',onerror:e=>e.currentTarget.remove()}):null, body));
  }
  box.replaceChildren(...kids);
}
for (const k of FKEYS)
  $('#f-'+k).addEventListener('input', e=>{ S.draft[k]=e.target.value; if (k==='w'||k==='d'||k==='h'){ setMsg(''); renderResults(); } });
$('#f-photo').addEventListener('change', e=>{
  const file=e.target.files && e.target.files[0]; if (!file) return;
  if (S.draft.fileUrl) URL.revokeObjectURL(S.draft.fileUrl);
  S.draft.file=file; S.draft.fileUrl=''; renderFormExtras();
});
$('#furnForm').addEventListener('submit', e=>e.preventDefault());
$('#furnPlace').addEventListener('click', ()=>{ const sp=draftSpec(); if (sp){ setMsg(''); placeItem(sp); } });
$('#furnSave').addEventListener('click', async e=>{
  const b=e.currentTarget; b.disabled=true;
  let r=null; try { r=await saveDraft(); } finally { b.disabled=false; }
  if (!r) return;
  loadDraft(null); renderStage(); renderEditor();
  setMsg(r.photoErr ? '已存進收藏庫，但照片沒有上傳成功。' : (r.isNew?'已存進收藏庫。':'收藏庫已更新。'), r.photoErr);
});
$('#furnClear').addEventListener('click', ()=>loadDraft(null));
$('#addDecor').addEventListener('click', ()=>{
  setTab('furn'); loadDraft(null);
  $('#furnForm').scrollIntoView({block:'start',behavior:'smooth'}); $('#f-name').focus({preventScroll:true});
});

/* ---------- 工具列、分頁 ---------- */
function setTab(t){
  S.tab=t;
  $('#tabItems').setAttribute('aria-selected',String(t==='items')); $('#tabFurn').setAttribute('aria-selected',String(t==='furn'));
  $('#paneItems').hidden=t!=='items'; $('#paneFurn').hidden=t!=='furn';
  if (t==='furn'){ renderResults(); renderSaved(); } else renderList();
  renderOver();
}
$('#tabItems').addEventListener('click', ()=>setTab('items'));
$('#tabFurn').addEventListener('click', ()=>setTab('furn'));
$('#addBox').addEventListener('click', ()=>addItem('box'));
$('#addDim').addEventListener('click', ()=>addItem('dim'));
$('#addLine').addEventListener('click', ()=>addItem('line'));
$('#addMark').addEventListener('click', ()=>addItem('mark'));
$('#btnDims').addEventListener('click', e=>{ S.showDims=!S.showDims; e.currentTarget.setAttribute('aria-pressed',String(S.showDims)); renderDims(); });
const ZOOMS=[1,1.5,2,3];
function zoomBy(d){ const i=Math.min(ZOOMS.length-1,Math.max(0,ZOOMS.indexOf(S.zoom)+d)); S.zoom=ZOOMS[i]; renderStage(); }
$('#zoomIn').addEventListener('click', ()=>zoomBy(1));
$('#zoomOut').addEventListener('click', ()=>zoomBy(-1));

function renderAll(){ renderNav(); renderStage(); renderEditor(); if (S.tab==='furn'){ renderResults(); renderSaved(); } else renderList(); }

/* ---------- 雲端更新 ---------- */
let remoteTimer=null;
function refreshFromRemote(){
  clearTimeout(remoteTimer);
  remoteTimer=setTimeout(()=>{
    if (drag && drag.on) return;
    fixSelection(); renderNav(); renderStage();
    if (!$('#editor').contains(document.activeElement)) renderEditor(); else renderReadout();
    if (S.tab==='furn'){ renderResults(); renderSaved(); } else renderList();
  },60);
}
function applyRemote(path, doc){ applyDoc(S.data, path, doc); refreshFromRemote(); }
async function reloadAll(){
  if (loading || pending.size || inflight || (drag && drag.on)) return;
  try {
    const d=await store.load();
    if (pending.size || inflight) return;
    S.data=(d && typeof d==='object')?d:{}; mergeSeed(S.data);
    syncErr=false; setSync(); refreshFromRemote();
  } catch(e){}
}

/* ---------- 啟動 ---------- */
function showNote(t){ const el=$('#notice'); el.hidden=!t; el.textContent=t||''; }
async function connect(){
  let data;
  try { data=await store.load(); }
  catch(e){
    loading=false; syncErr=true; setSync();
    showNote('暫時連不上共用資料庫，目前顯示的是圖面原始尺寸，這時候的修改不會被儲存。會自動重試。');
    setTimeout(connect,10000); return;
  }
  S.data=(data && typeof data==='object')?data:{};
  const writes=mergeSeed(S.data);
  fixSelection(); loading=false; syncErr=false;
  for (const p of writes) flush(p);
  showNote(store.remote?'':'尚未連上共用資料庫：現在填寫的內容只會存在這台裝置的瀏覽器，其他人看不到。');
  setSync(); renderAll();
  store.listen(applyRemote, reloadAll, ok=>{ online=ok; setSync(); });
}
(function init(){
  S.data={}; mergeSeed(S.data); fixSelection(); setSync(); renderAll(); renderFormExtras(); connect();
})();
</script>
